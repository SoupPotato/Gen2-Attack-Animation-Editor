/* -------------------------------------------------------------- raw view */

function serialize(label){
  return serializeBlock(D.blocks[label]).join("\n");
}
function parseRaw(text){
  const out = [];
  for (const raw of text.split("\n")){
    let line = raw, comment = "";
    const ci = line.indexOf(";");
    if (ci >= 0){ comment = line.slice(ci+1).trim(); line = line.slice(0, ci); }
    const s = line.trim();
    if (!s && !comment){ out.push({t:"blank"}); continue; }
    if (!s){ out.push({t:"comment", text:comment}); continue; }
    if (LABEL_RE.test(s)) continue;
    if (LOCAL_RE.test(s)){ out.push({t:"label", name:s.replace(/:$/,"")}); continue; }
    const m = s.match(/^(\S+)\s*(.*)$/);
    out.push({t:"cmd", cmd:m[1], args: m[2] ? splitArgs(m[2]) : [], comment});
  }
  return out;
}

/* ----------------------------------------------------------------- saving */

function buildFileText(){
  const out = SRC.lines.slice();
  const ranges = [];
  for (const label of dirty){
    const b = D.blocks[label];
    if (b) ranges.push([b.start, b.end, serializeBlock(b)]);
  }
  ranges.sort((a,b) => b[0]-a[0]);
  for (const [s, e, text] of ranges) out.splice(s, e - s + 1, ...text);
  return out.join("\n");
}

async function saveToRepo(){
  if (!dirty.size){ $("#status").textContent = "nothing changed"; return; }
  if (!REPO.writable){
    $("#status").textContent = "read-only repo — use Download .asm";
    return;
  }
  try {
    const text = buildFileText();
    await REPO.write(ANIM_FILE, text);
    // re-parse so block line ranges stay in sync for the next save
    SRC = parseAnimations(text);
    for (const l of Object.keys(SRC.blocks)) if (D.blocks[l]) D.blocks[l] = SRC.blocks[l];
    D.blocks = SRC.blocks; D.blockOrder = SRC.order; D.table.forEach((e,i) => {
      if (SRC.table[i]) e.index = SRC.table[i].index;
    });
    const n = dirty.size;
    dirty.clear(); buildList(); buildCmds();
    $("#status").textContent = "saved " + n + " animation(s) to " + ANIM_FILE;
  } catch (e){
    $("#status").textContent = "save failed: " + e.message;
  }
}

function downloadAsm(){
  const blob = new Blob([buildFileText()], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "animations.asm";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  $("#status").textContent = "downloaded animations.asm — replace " + ANIM_FILE;
}

/* ------------------------------------------------------------- interaction */

let drag = null;

function wireUI(){
  $("#filter").oninput = () => buildList();
  $("#add").onclick = () => {
    const k = $("#addsel").value, list = items(cur);
    const at = sel >= 0 ? sel + 1 : list.length;
    snapshot();
    if (k === "(local label)"){
      const name = prompt("label name (with leading dot)", ".loop");
      if (!name) return;
      list.splice(at, 0, {t:"label", name});
    } else list.splice(at, 0, {t:"cmd", cmd:k, args:[...TEMPLATES[k]], comment:""});
    sel = at; buildCmds(); touched();
  };
  $("#undo").onclick = () => {
    const u = undoStack.pop();
    if (!u) return;
    D.blocks[u.label].items = u.items;
    dirty.add(u.label);
    if (cur !== u.label) select(u.label); else { buildCmds(); buildTimeline(); render(); buildList(); }
  };
  $("#tab-cmd").onclick = () => {
    $("#tab-cmd").classList.add("on"); $("#tab-raw").classList.remove("on");
    $("#cmdview").classList.remove("hidden"); $("#raw").classList.add("hidden");
    buildCmds(); render();
  };
  $("#tab-raw").onclick = () => {
    $("#tab-raw").classList.add("on"); $("#tab-cmd").classList.remove("on");
    $("#raw").classList.remove("hidden"); $("#cmdview").classList.add("hidden");
    $("#raw").value = serialize(cur);
  };
  $("#raw").addEventListener("blur", () => {
    if ($("#raw").classList.contains("hidden")) return;
    snapshot();
    D.blocks[cur].items = parseRaw($("#raw").value);
    buildTimeline(); render(); dirty.add(cur); buildList();
  });

  $("#play").onclick = () => {
    playing = !playing;
    $("#play").textContent = playing ? "❚❚ pause" : "▶ play";
    last = performance.now(); acc = 0; loopWait = 0; loopPhase = null; tickHold = 0;
    if (playing){ audioCtx(); fireSfx(frame); requestAnimationFrame(loop); }
    else stopSfx();
  };
  const vol = $("#volume");
  if (vol){
    setVolume(+vol.value / 100);
    $("#volval").textContent = vol.value + "%";
    vol.oninput = () => {
      setVolume(+vol.value / 100);
      $("#volval").textContent = vol.value + "%";
    };
  }
  $("#sound").onchange = async () => {
    if ($("#sound").checked){
      audioCtx();
      if (musicPick) await playMusic(musicPick);
    } else {
      stopSfx();
      stopMusic();           // stopSfx only cuts the effect voice
    }
  };
  $("#rew").addEventListener("click", stopSfx);
  $("#stepf").onclick = () => { loopPhase = null; frame = Math.min(maxFrame, frame+1); render(); };
  $("#stepb").onclick = () => { frame = Math.max(0, frame-1); render(); };
  $("#rew").onclick = () => { frame = 0; render(); };
  $("#turn").onchange = () => { frame = 0; buildTimeline(); render(); };
  $("#param").onchange = () => { frame = 0; buildTimeline(); render(); };
  ["grid","boxes","marks","hud","gbctiming","textbox"].forEach(id => $("#"+id).onchange = render);
  [["showBg","bg"],["showTarget","target"],["showUser","user"]].forEach(([id,key]) =>
    $("#"+id).onchange = () => { scene[key] = $("#"+id).checked; saveScene(); render(); });
  $("#bgload").onclick = () => $("#bginput").click();
  $("#bginput").onchange = async ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const im = await loadImg(url);
    if (im){ bgSrc = im; bgImg = backdropWithNames(im); remapCache.clear();
             swapPicCache.clear(); transformPicCache.clear(); scene.bg = true;
             $("#showBg").checked = true; render(); }
    URL.revokeObjectURL(url);
  };
  $("#save").onclick = saveToRepo;
  $("#download").onclick = downloadAsm;
  $("#reload").onclick = async () => {
    if (dirty.size && !confirm("Discard unsaved changes and re-read the repo?")) return;
    dirty.clear(); undoStack = [];
    await start(REPO);
  };

  tlc.addEventListener("mousedown", ev => {
    const r = tlc.getBoundingClientRect();
    const w = tlc.width;
    frame = Math.round(((ev.clientX - r.left - 34) / (w - 44)) * maxFrame);
    frame = Math.max(0, Math.min(maxFrame, frame));
    playing = false; loopPhase = null; $("#play").textContent = "▶ play";
    render();
  });

  screenEl.addEventListener("mousedown", ev => {
    const r = screenEl.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / SCALE, my = (ev.clientY - r.top) / SCALE;
    const sim = simAt(frame);
    let best = null, bd = 14;
    for (const o of sim.objs){
      if (!o.at || o.at.label !== cur || o.drawX === undefined) continue;
      const ax = b(o.drawX + o.drawXoff) - 8, ay = b(o.drawY + o.yoff) - 16;
      const d = Math.hypot(ax - mx, ay - my);
      if (d < bd){ bd = d; best = o; }
    }
    if (!best) return;
    const it = items(cur)[best.at.ip];
    if (!it || it.cmd !== "anim_obj") return;
    sel = best.at.ip;
    snapshot();
    const ax = b(best.drawX + best.drawXoff) - 8, ay = b(best.drawY + best.yoff) - 16;
    drag = {ip: best.at.ip, mirrored: !!(sim.turn && (best.flags & 1)), o: best,
            ox: mx - ax, oy: my - ay};
    buildCmds(); render();
  });
  window.addEventListener("mousemove", ev => {
    if (!drag) return;
    const r = screenEl.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / SCALE, my = (ev.clientY - r.top) / SCALE;
    // undo this frame's offsets and (on the enemy side) the coord mirror,
    // so the drag edits the spawn coords the script actually holds
    const ob = drag.o;
    // rendered anchor the pointer is asking for, in OAM coords
    const rx = Math.round(mx - drag.ox) + 8, ry = Math.round(my - drag.oy) + 16;
    let x, y;
    if (drag.mirrored){
      const mirX = b(rx - b(-ob.xoff));            // x offset is negated there
      const mirY = b(ry - ob.yoff);
      x = b(180 - mirX);
      y = ob.fixY === 0xff ? b(mirY - 40) : b(ob.fixY - mirY);
    } else {
      x = b(rx - ob.xoff);
      y = b(ry - ob.yoff);
    }
    if (ev.shiftKey){ x = Math.round(x/8)*8; y = Math.round(y/8)*8; }
    setObjCoords(items(cur)[drag.ip], b(x), b(y));
    dirty.add(cur); buildCmds(); render();
  });
  window.addEventListener("mouseup", () => {
    if (!drag) return;
    drag = null;
    touched();
  });

  window.addEventListener("keydown", ev => {
    if (ev.target.matches("input,select,textarea")) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "s"){ ev.preventDefault(); saveToRepo(); return; }
    if (ev.key === " "){ ev.preventDefault(); $("#play").click(); return; }
    if (sel < 0) return;
    const it = items(cur)[sel];
    if (!it || it.cmd !== "anim_obj") return;
    const d = ev.shiftKey ? 8 : 1;
    let dx = 0, dy = 0;
    if (ev.key === "ArrowLeft") dx = -d; else if (ev.key === "ArrowRight") dx = d;
    else if (ev.key === "ArrowUp") dy = -d; else if (ev.key === "ArrowDown") dy = d;
    else return;
    ev.preventDefault();
    snapshot();
    const c = objCoords(it);
    setObjCoords(it, b(c.x + dx), b(c.y + dy));
    buildCmds(); touched();
  });
  window.addEventListener("beforeunload", ev => {
    if (dirty.size){ ev.preventDefault(); ev.returnValue = ""; }
  });
  window.addEventListener("resize", () => render());
}

function fireSfx(f){
  if (!$("#sound").checked) return;
  for (const e of (timeline || [])){
    if (e.f !== f) continue;
    if (e.k === "sfx" && e.name) playSfx(e.name);
    else if (e.k === "cry") playCry(monPick[e.side], e.param);
  }
}

let loopWait = 0;                       // frames left of the pause between loops
let tickHold = 0;                       // vblanks still owed to this iteration
let loopPhase = null;                   // null | "sfx" (waiting on audio) | "delay"
const sfxBusy = () => !!(playingSfx && $("#sound").checked);

function loop(t){
  if (!playing) return;
  const step = 1000/59.7 / (+$("#speed").value);
  acc += t - last; last = t;
  let guard = 0;
  while (acc >= step && guard++ < 8){
    acc -= step;
    // after the script's ret the scene is reset, then we wait for the sound
    // to finish, then for the pause, before starting over
    if (loopPhase === "sfx"){
      if (sfxBusy()) continue;
      loopPhase = $("#loopdelay").checked ? "delay" : null;
      loopWait = 60;                    // 1 second at 60 fps
      if (!loopPhase){ frame = 0; fireSfx(frame); }
      continue;
    }
    if (loopPhase === "delay"){
      if (--loopWait > 0) continue;
      loopPhase = null;
      frame = 0;
      fireSfx(frame);
      continue;
    }
    // an iteration that overran its vblank holds the picture an extra frame
    if ($("#gbctiming").checked && tickHold > 1){ tickHold--; continue; }
    frame++;
    if (frame >= maxFrame){
      frame = maxFrame;
      loopPhase = "sfx";
      tickHold = 0;
      continue;
    }
    tickHold = (tickVblanks[frame] || 1);
    fireSfx(frame);
  }
  render();
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------ boot */

const log = m => { $("#openlog").textContent += m + "\n"; };

async function start(repo){
  $("#openlog").textContent = "";
  $("#openerr").textContent = "";
  $("#open").classList.remove("hidden");
  try {
    await loadRepo(repo, log);
  } catch (e){
    $("#openerr").textContent = e.message;
    return;
  }
  indexTiles();
  $("#addsel").innerHTML = Object.keys(TEMPLATES).map(k => "<option>" + k + "</option>").join("");
  const un = D.unimplemented || [];
  if (un.length)
    log("no movement code for " + un.length + " function(s): " + un.join(", "));
  const bgu = D.bgUnimplemented || [];
  if (bgu.length)
    log("no bg effect code for " + bgu.length + ": " + bgu.join(", "));
  const w = D.gfxWarnings || [];
  $("#warn").textContent = w.length
    ? "PNG-derived tiles differ from the table for: " + w.slice(0,6).join(", ") +
      (w.length > 6 ? "…" : "") + " — run `make` once and it reads the built .2bpp instead"
    : (D.gfx.some(g => g.origin === "2bpp") ? "" : "previewing tiles decoded from PNGs");
  $("#save").disabled = !repo.writable;
  $("#open").classList.add("hidden");
  buildList();
  select(D.blocks[cur] ? cur : (D.table[1] ? D.table[1].label : D.blockOrder[0]));
}

async function pickDirectory(){
  const handle = await window.showDirectoryPicker({id:"pokecrystal", mode:"readwrite"});
  const perm = await handle.requestPermission({mode:"readwrite"});
  const repo = dirHandleRepo(handle);
  repo.writable = perm === "granted";
  await idbSet("lastdir", handle);
  return repo;
}

async function main(){
  initCanvases();
  await loadSceneAssets();
  wireUI();
  syncSceneInputs();

  const hasFS = typeof window.showDirectoryPicker === "function";
  $("#pick").disabled = !hasFS;
  $("#fsnote").innerHTML = hasFS
    ? "Saving writes straight back to <code>data/moves/animations.asm</code>."
    : "This browser can't open folders for writing (Chrome, Edge or Opera can, over " +
      "<code>https</code> or <code>localhost</code>). Use <b>Choose folder</b> to preview " +
      "and edit, then <b>Download .asm</b>.";

  $("#pick").onclick = async () => {
    try { await start(await pickDirectory()); }
    catch (e){ if (e.name !== "AbortError") $("#openerr").textContent = e.message; }
  };
  $("#pickfallback").onclick = () => $("#dirinput").click();
  $("#dirinput").onchange = async ev => {
    if (ev.target.files.length) await start(fileListRepo([...ev.target.files]));
  };

  // offer to reopen the last folder
  const saved = await idbGet("lastdir");
  if (saved && saved.queryPermission){
    $("#reopen").classList.remove("hidden");
    $("#reopenname").textContent = saved.name;
    $("#reopen").onclick = async () => {
      try {
        let p = await saved.queryPermission({mode:"readwrite"});
        if (p !== "granted") p = await saved.requestPermission({mode:"readwrite"});
        const repo = dirHandleRepo(saved);
        repo.writable = p === "granted";
        await start(repo);
      } catch (e){ $("#openerr").textContent = e.message; }
    };
  }

  // if this page is served from inside the repo, offer that as a one-click option
  if (location.protocol.startsWith("http")){
    for (const base of ["./", "../"]){
      try {
        const r = await fetch(base + ANIM_FILE, {method:"HEAD"});
        if (r.ok){
          const b = document.createElement("button");
          b.textContent = "Load from this server (read-only)";
          b.onclick = () => start(fetchRepo(base));
          document.querySelector("#open .btns").appendChild(b);
          break;
        }
      } catch {}
    }
  }
}

if (typeof document !== "undefined" && document.getElementById("open")) main();
</script>
