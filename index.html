/* anim_obj comes in two shapes: the current
     anim_obj OBJ, x, y, param
   and the legacy tile+offset form
     anim_obj OBJ, x_tile, x, y_tile, y, param
   Both are read here, and edits are written back in whichever form the line
   already uses so a repo's style is preserved. */
function objCoords(it){
  const a = it.args || [];
  if (a.length >= 6)
    return {x: b(nv(a[1]) * 8 + nv(a[2])), y: b(nv(a[3]) * 8 + nv(a[4])),
            param: a[5], legacy: true};
  return {x: nv(a[1]), y: nv(a[2]), param: a[3], legacy: false};
}
function setObjCoords(it, x, y){
  const a = it.args;
  if (a.length >= 6){
    a[1] = String(x >> 3); a[2] = String(x & 7);
    a[3] = String(y >> 3); a[4] = String(y & 7);
  } else {
    a[1] = String(b(x)); a[2] = String(b(y));
  }
}

const FLOW = new Set(["anim_jump","anim_loop","anim_call","anim_ret","anim_if_param_equal",
  "anim_if_param_and","anim_if_var_equal","anim_setvar","anim_incvar","anim_jumpuntil"]);

function nv(tok){
  if (tok === undefined || tok === null) return 0;
  const t = String(tok).trim();
  if (t.startsWith("$")) return parseInt(t.slice(1), 16) || 0;
  if (t.startsWith("%")) return parseInt(t.slice(1), 2) || 0;
  const v = parseInt(t, 10);
  return isNaN(v) ? 0 : v;
}

// argument value that may be a constant name rather than a literal
function cv(tok){
  const t = String(tok === undefined ? "" : tok).trim();
  if (D && D.consts && Object.prototype.hasOwnProperty.call(D.consts, t)) return D.consts[t];
  return nv(t);
}

function findLabel(label, name){
  const it = items(label);
  for (let i = 0; i < it.length; i++) if (it[i].t === "label" && it[i].name === name) return i;
  return -1;
}

class Sim {
  constructor(root, param, turn){
    this.root = root; this.param = param; this.turn = turn;
    // the engine keys its Surf slowdown off wFXAnimID, i.e. the move itself
    const surfIdx = D.consts.SURF;
    const entry = surfIdx !== undefined ? D.table[surfIdx] : null;
    this.isSurf = !!(entry && entry.label === root);
    this.reset();
  }
  reset(){
    this.stack = [{label:this.root, ip:0}];
    this.objs = []; this.tileDict = {}; this.tileTop = 0;
    this.wait = 0; this.done = false; this.frame = 0;
    this.vars = 0; this.loops = {}; this.events = []; this.lastIp = null;
    this.lastIndex = 0;
    // wActiveBGEffects is a fixed array of NUM_BG_EFFECTS structs, not a queue.
    // QueueBGEffect takes the lowest-numbered free slot and ExecuteBGEffects
    // walks them in slot order, so a slot freed by one effect is reused by the
    // next one queued and the reuse reorders who writes wBGP last. Counter
    // depends on this: its nine FLASH_INVERTED instances overlap in pairs, and
    // which of the pair runs second decides whether that frame is inverted.
    this.bgfx = new Array(NUM_BG_EFFECTS).fill(null);
    this.screen = newScreenState();
    this.spill = 0;                      // unfinished work carried over
    this.surfDelay = false;              // RunBattleAnimScript's Surf slowdown
    this.vblanks = [];                   // vblanks each iteration took
  }
  top(){ return this.stack[this.stack.length-1]; }
  jumpTo(target){
    const t = String(target).trim();
    if (t.startsWith(".")){
      const i = findLabel(this.top().label, t);
      if (i >= 0){ this.top().ip = i + 1; return true; }
      return false;
    }
    if (D.blocks[t]){ this.stack[this.stack.length-1] = {label:t, ip:0}; return true; }
    const q = qualified(t);
    if (q){ this.stack[this.stack.length-1] = {label:q.label, ip:q.ip}; return true; }
    return false;
  }
  call(target){
    const t = String(target).trim();
    if (t.startsWith(".")){
      const i = findLabel(this.top().label, t);
      if (i < 0) return;
      this.stack.push({label:this.top().label, ip:i+1});
      return;
    }
    if (D.blocks[t]){ this.stack.push({label:t, ip:0}); return; }
    const q = qualified(t);
    if (q) this.stack.push({label:q.label, ip:q.ip});
  }
  exec(){
    if (this.done) return;
    const fr = this.top();
    if (!fr){ this.done = true; return; }
    const list = items(fr.label);
    if (fr.ip >= list.length){
      this.stack.pop();
      if (!this.stack.length) this.done = true;
      return;
    }
    const it = list[fr.ip];
    const here = {label:fr.label, ip:fr.ip};
    fr.ip++;
    if (it.t !== "cmd") return;
    this.lastIp = here;
    const a = it.args || [];
    switch (it.cmd){
      case "anim_wait": this.wait = nv(a[0]); break;
      case "anim_1gfx": case "anim_2gfx": case "anim_3gfx":
      case "anim_4gfx": case "anim_5gfx": {
        this.tileDict = {}; this.tileTop = 0;
        for (const g of a){
          const k = g.trim(), gi = gfxIndex(k);
          this.tileDict[k] = this.tileTop;
          this.tileTop += gi >= 0 ? (D.gfx[gi].count || 0) : 0;
        }
        break;
      }
      case "anim_obj":
        if (this.spawn(a, here)) this.events.push({f:this.frame, k:"obj", name:a[0], at:here});
        break;
      case "anim_sound": this.events.push({f:this.frame, k:"sfx", name:(a[2]||"").trim(), at:here}); break;
      /* anim_cry plays the *attacker's own* cry, with a pitch/length delta
         picked by its one argument - Growl passes $0, Roar $1. The side is the
         attacker's, so it follows the turn like the pic swaps do. */
      case "anim_cry":
        this.events.push({f:this.frame, k:"cry", param: nv(a[0]) & 0x3,
                          side: this.userSide(), at:here});
        break;
      case "anim_bgeffect": {
        // anim_bgeffect effect, jumptable index, battle turn, param
        const name = (a[0] || "").trim();
        const id = D.consts[name];
        const e = {
          name, id, jti: cv(a[1]), turn: cv(a[2]), param: cv(a[3]),
          dead: false, at: here, born: this.frame,
        };
        // BGEffect_CheckBattleTurn: 0 -> the enemy pic, otherwise the player's
        const res = ((this.turn & 1) ^ (e.turn & 1)) & 1;
        e.side = res === 0 ? 0 : 1;              // 0 = enemy pic, 1 = player pic
        e.targetSide = e.side === 0;
        // QueueBGEffect: first slot whose function byte is 0; scf (dropped)
        // if every slot is busy
        const slot = this.bgfx.indexOf(null);
        if (slot >= 0) this.bgfx[slot] = e; else e.dropped = true;
        this.events.push({f:this.frame, k:"bg", name, at:here});
        break;
      }
      case "anim_incbgeffect": {
        const name = (a[0] || "").trim();
        for (const e of this.bgfx) if (e && e.name === name) e.jti = b(e.jti + 1);
        this.events.push({f:this.frame, k:"bg", name, at:here});
        break;
      }
      case "anim_bgp": this.screen.bgp = nv(a[0]); break;
      case "anim_obp0": this.screen.obp0 = nv(a[0]); break;
      case "anim_obp1": this.screen.obp1 = nv(a[0]); break;
      case "anim_battlergfx_1row": this.battlerRows = 1; break;
      case "anim_battlergfx_2row": this.battlerRows = 2; break;
      /* The pic-swap commands, all acting on whichever pic belongs to the
         attacker. hBattleTurn 0 is the player's turn and takes the 6x6 slot at
         vTiles2 tile $31, so side 1 here; otherwise the enemy's 7x7 at $00.
         Where each one writes decides when it becomes visible: RaiseSub and
         MinimizeOpp request into vTiles2 and show immediately, while Minimize
         only fills the vTiles0 staging buffer and waits for updateactorpic.
         A repo that stubs a command out - Sour Crystal rets on both minimize
         commands - parses to no layout, so nothing swaps. */
      case "anim_raisesub":
        if (PIC_SWAPS.sub[this.userSide()]) this.screen.monPicSwap[this.userSide()] = "sub";
        break;
      case "anim_minimizeopp":
        if (PIC_SWAPS.minimize[this.userSide()])
          this.screen.monPicSwap[this.userSide()] = "minimize";
        break;
      case "anim_minimize":
        if (PIC_SWAPS.minimize[this.userSide()])
          this.screen.monPicStaged[this.userSide()] = "minimize";
        break;
      case "anim_transform":                   // the other battler's species
        this.screen.monPicStaged[this.userSide()] = "transform";
        break;
      case "anim_updateactorpic":
        this.screen.monPicSwap[this.userSide()] = this.screen.monPicStaged[this.userSide()];
        break;
      case "anim_dropsub":                     // DropPlayerSub / DropEnemySub
        this.screen.monPicSwap[this.userSide()] = null;
        this.screen.monPicStaged[this.userSide()] = null;
        break;
      case "anim_clearobjs":
        this.objs = [];
        this.screen.picRows = [];              // the pic-row objects go too
        break;
      case "anim_incobj":
        for (const o of this.objs) if (o.id === nv(a[0])) o.jti = b(o.jti + 1);
        break;
      case "anim_setobj":
        for (const o of this.objs) if (o.id === nv(a[0])) o.jti = nv(a[1]);
        break;
      /* Sour Crystal's dynamic palettes. anim_setobjpal / anim_setbgpal take a
         palette *slot* and a custom palette, and overwrite that slot's four
         colours with the custom one - BattleAnimCmd_SetObjPal copies from
         CustomBattlePalettes (gfx/battle_anims/custom.pal) into wOBPals1 or
         wBGPals1 at the slot's offset. Objects keep whatever palette they were
         defined with; it is the slot underneath them that changes, so

           anim_setobjpal PAL_BATTLE_OB_RED, PAL_BTLCUSTOM_FIRE

         recolours every particle drawn in OB_RED for the rest of the
         animation. A slot given $ff is put back to its default. */
      case "anim_setobjpal":
      case "anim_setbgpal": {
        // both arguments are written as constants, so both need resolving -
        // nv() alone turns PAL_BATTLE_OB_RED into 0 and recolours the wrong slot
        const pc = n => {
          const k = (n || "").trim();
          return D.palConsts[k] !== undefined ? D.palConsts[k] : nv(k);
        };
        const slot = pc(a[0]) & 0xff;
        const custom = pc(a[1]);
        const into = it.cmd === "anim_setobjpal"
          ? this.screen.objPalSet : this.screen.bgPalSet;
        if ((custom & 0xff) === 0xff) delete into[slot];   // .SetDefaultPal
        else into[slot] = custom;
        break;
      }
      case "anim_setvar": this.vars = nv(a[0]); break;
      case "anim_incvar": this.vars++; break;
      case "anim_if_var_equal": if (this.vars === nv(a[0])) this.jumpTo(a[1]); break;
      case "anim_if_param_equal": if (this.param === nv(a[0])) this.jumpTo(a[1]); break;
      case "anim_if_param_and": if (this.param & nv(a[0])) this.jumpTo(a[1]); break;
      case "anim_jump": this.jumpTo(a[0]); break;
      /* anim_jumpuntil counts wBattleAnimParam down: while it is non-zero it
         decrements and jumps, and once it hits zero it falls through past the
         address. Treating it as a plain jump looped forever - Fury Cutter and
         Magnitude both use it to repeat once per hit or magnitude level. */
      case "anim_jumpuntil":
        if (this.param !== 0){
          this.param = b(this.param - 1);
          this.jumpTo(a[0]);
        }
        break;
      case "anim_loop": {
        const key = fr.label + ":" + here.ip;
        if (this.loops[key] === undefined) this.loops[key] = nv(a[0]);
        this.loops[key]--;
        if (this.loops[key] > 0) this.jumpTo(a[1]); else delete this.loops[key];
        break;
      }
      case "anim_call": this.call(a[0]); break;
      case "anim_ret":
        this.stack.pop();
        if (!this.stack.length) this.done = true;
        break;
      default: break;
    }
  }
  spawn(a, at){
    const name = (a[0]||"").trim(), oi = objIndex(name);
    if (oi < 0) return null;
    const def = D.objects[oi];
    const c = objCoords({args: a});
    this.lastIndex = b(this.lastIndex + 1);          // wLastAnimObjectIndex
    const o = {
      id: this.lastIndex, def, name, at, born: this.frame, dead: false,
      // BATTLEANIMSTRUCT_* - coords stay raw; the enemy-side fix is applied
      // when drawing, exactly like InitBattleAnimBuffer does each frame
      flags: def.flags, fixY: def.fixY, framesetId: def.frameset,
      pal: def.pal, x: c.x, y: c.y, xoff: 0, yoff: 0,
      param: cv(c.param), duration: 0, frameIdx: -1, jti: 0,
      var1: 0, var2: 0, var3: 0, var4: 0,
      cur: null, funcErr: false,
    };
    this.objs.push(o);
    return o;
  }
  ctx(){
    return {
      turn: this.turn,
      animVar: this.vars,                            // wBattleAnimVar
      screen: this.screen,                           // a few functions touch the LCD
      fs: name => (D.consts[name] !== undefined ? D.consts[name] : 0),
    };
  }
  // 0 = enemy pic, 1 = player pic; hBattleTurn 0 means the player is acting
  userSide(){ return this.turn ? 0 : 1; }
  funcFor(o){    const i = D.consts[o.def.func];
    return i !== undefined ? AF[ANIM_FUNC_ORDER[i]] : undefined;
  }
  tick(){
    /* RunBattleAnimCommand.CheckTimer: while wBattleAnimDelay is non-zero it
       decrements and returns with carry clear, so the script does not run at
       all that frame. Commands resume on the frame *after* the delay reaches
       zero, which makes anim_wait N cost N+1 frames - the frame the wait was
       read, plus N skipped. Decrementing in the same frame the wait was set
       lost one frame per wait, roughly 20% across a whole animation. */
    let runScript = true;
    if (this.wait > 0){ this.wait--; runScript = false; }
    let guard = 0;
    if (runScript)
      while (!this.done && this.wait <= 0 && guard++ < 5000) this.exec();
    this.runBGEffects();
    const S = this.ctx();
    for (const o of this.objs){
      if (o.dead) continue;
      const fn = this.funcFor(o);
      if (fn){
        try { fn(o, S); } catch (e){ o.funcErr = true; }
      }
      if (!o.dead) this.oamUpdate(o);
    }
    this.objs = this.objs.filter(o => !o.dead);
    this.tickCost();
    this.frame++;
  }
  // charge this iteration's work and see whether it overran its vblank
  tickCost(){
    const S = this.screen;
    let cost = ENGINE_BASE + this.objs.length * OBJECT_TSTATES + (S.work || 0);
    if (S.ly) cost += LCD_STAT_TSTATES;
    S.work = 0;
    this.spill += cost;
    let vb = 0;
    while (this.spill >= FRAME_TSTATES){ this.spill -= FRAME_TSTATES; vb++; }
    vb = Math.max(1, vb);
    /* RunBattleAnimScript: "Slow down Surf's animation" - for the SURF move it
       calls BattleAnimDelayFrame a second time on alternate iterations, so the
       whole animation runs at two thirds speed. */
    if (this.isSurf){
      this.surfDelay = !this.surfDelay;
      if (this.surfDelay) vb++;
    }
    this.vblanks.push(vb);
  }
  // ExecuteBGEffects: every active effect gets a frame, writing into the
  // screen state the renderer then applies
  runBGEffects(){
    const S = this.screen;
    S.scx = 0; S.scy = 0;                        // hSCX/hSCY are rewritten each frame
    for (let i = 0; i < this.bgfx.length; i++){
      const e = this.bgfx[i];
      if (!e || e.dead) continue;
      const name = BG_EFFECT_ORDER[e.id];
      const fn = name ? BGF[name] : null;
      if (!fn){ e.unknown = true; continue; }
      try { fn(e, S); } catch (err){ e.errored = true; }
    }
    // EndBattleBGEffect zeroes the slot's function byte; the slot itself stays
    // where it is and is the next one QueueBGEffect hands out
    for (let i = 0; i < this.bgfx.length; i++)
      if (this.bgfx[i] && this.bgfx[i].dead) this.bgfx[i] = null;
    if (S.objIndexBump){
      this.lastIndex = b(this.lastIndex + S.objIndexBump);
      S.objIndexBump = 0;
    }
  }
  // GetBattleAnimFrame: duration counts down, oamend holds the last frame,
  // oamwait hides the object, oamdelete removes it
  oamUpdate(o){
    const fs = D.framesets[o.framesetId];
    if (!fs){ o.dead = true; return; }
    const at = i => D.framesetEntries[fs.start + i];
    let guard = 0;
    while (guard++ < 128){
      if (o.duration !== 0){
        o.duration = b(o.duration - 1);
        const e = at(o.frameIdx);
        o.cur = (e && e.c === "frame") ? e : null;
        return;
      }
      o.frameIdx++;
      const e = at(o.frameIdx);
      if (!e){ o.dead = true; return; }
      if (e.c === "restart"){ o.duration = 0; o.frameIdx = -1; continue; }
      if (e.c === "end"){ o.duration = 0; o.frameIdx -= 2; continue; }
      if (e.c === "delete"){ o.dead = true; return; }
      o.duration = e.dur;
      o.cur = e.c === "frame" ? e : null;
      return;
    }
  }
}

let tickVblanks = [];          // vblanks each engine iteration occupies

function buildTimeline(){
  const sim = new Sim(cur, nv($("#param").value), +$("#turn").value);
  while (!sim.done && sim.frame < 1200) sim.tick();
  maxFrame = Math.max(1, sim.frame);
  timeline = sim.events;
  tickVblanks = sim.vblanks;
}
function simAt(f){
  const sim = new Sim(cur, nv($("#param").value), +$("#turn").value);
  for (let i = 0; i < f && !sim.done; i++) sim.tick();
  return sim;
}

/* ------------------------------------------------------------- rendering */

/* Screen state the BG effects write into: DMG palette maps, scroll and
   per-mon presentation (index 0 = enemy pic, 1 = player pic). */
function newScreenState(){
  return {
    bgp: DMG_IDENTITY, obp0: DMG_IDENTITY, obp1: DMG_IDENTITY,
    scx: 0, scy: 0,
    monVisible: [true, true], monDX: [0, 0], monDY: [0, 0],
    monBright: [0, 0], monTint: [null, null], monGhost: [0, 0],
    monClipBottom: [0, 0], monSquash: [0, 0], monWave: [0, 0],
    // anim_setobjpal / anim_setbgpal: slot index -> custom palette index
    objPalSet: {}, bgPalSet: {},
    monResize: [null, null],               // RunPicResizeScript's current square
    monPicSwap: [null, null],              // vTiles2: null | "sub" | "minimize"
    monPicStaged: [null, null],            // vTiles0, what updateactorpic copies
    ly: null, lyAxis: "x", lyStart: 0, lyEnd: 0, spriteBGP: null,
    monPal: [DMG_IDENTITY, DMG_IDENTITY],  // 0 = enemy pic, 1 = player pic
    picRows: [], objIndexBump: 0,
  };
}

/* A DMG palette write swaps colour *indices*, so an element keeps its own
   four colours and just uses them in a different order - white and black trade
   places, and the two mid colours trade with each other. The screenshot has no
   palette data attached, so each layer's colours are ranked by brightness into
   four levels once, and a remap then redraws every pixel as the colour that
   sits at its mapped level. */
const layerPalettes = new WeakMap();      // image -> {levelOf, rep}
const remapCache = new Map();             // "layerKey:byte" -> canvas

function analyseLayer(img){
  if (layerPalettes.has(img)) return layerPalettes.get(img);
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d", {willReadFrequently: true});
  ctx.drawImage(img, 0, 0);
  let data;
  try { data = ctx.getImageData(0, 0, c.width, c.height).data; }
  catch (e){ return null; }
  const counts = new Map();
  for (let i = 0; i < data.length; i += 4){
    if (data[i+3] < 128) continue;
    const key = (data[i] << 16) | (data[i+1] << 8) | data[i+2];
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  const lum = k => ((k >> 16 & 255) * 299 + (k >> 8 & 255) * 587 + (k & 255) * 114) / 1000;
  const colours = [...counts.keys()].sort((a, bb) => lum(bb) - lum(a));   // lightest first
  const levelOf = new Map();
  if (colours.length <= 4){
    colours.forEach((k, i) => levelOf.set(k, i));
  } else {
    // more colours than a palette holds (a scaled or anti-aliased capture):
    // group them into four brightness clusters weighted by how often each
    // colour appears, so stray edge pixels don't push real colours together
    let cent = [255, 170, 85, 0];
    for (let it = 0; it < 24; it++){
      const sum = [0, 0, 0, 0], wt = [0, 0, 0, 0];
      for (const k of colours){
        const l = lum(k);
        let best = 0;
        for (let j = 1; j < 4; j++)
          if (Math.abs(l - cent[j]) < Math.abs(l - cent[best])) best = j;
        sum[best] += l * counts.get(k);
        wt[best] += counts.get(k);
      }
      let moved = 0;
      for (let j = 0; j < 4; j++){
        if (!wt[j]) continue;
        const next = sum[j] / wt[j];
        moved = Math.max(moved, Math.abs(next - cent[j]));
        cent[j] = next;
      }
      if (moved < 0.01) break;
    }
    const order = [0, 1, 2, 3].sort((a, bb) => cent[bb] - cent[a]);
    const rank = {};
    order.forEach((j, i) => { rank[j] = i; });
    for (const k of colours){
      const l = lum(k);
      let best = 0;
      for (let j = 1; j < 4; j++)
        if (Math.abs(l - cent[j]) < Math.abs(l - cent[best])) best = j;
      levelOf.set(k, rank[best]);
    }
  }
  const rep = [null, null, null, null];   // most common colour at each level
  for (const [k, lvl] of levelOf){
    if (rep[lvl] === null || counts.get(k) > counts.get(rep[lvl])) rep[lvl] = k;
  }
  for (let l = 0; l < 4; l++){            // fill gaps with the nearest level
    if (rep[l] !== null) continue;
    for (let d = 1; d < 4; d++){
      if (rep[l-d] !== undefined && rep[l-d] !== null){ rep[l] = rep[l-d]; break; }
      if (rep[l+d] !== undefined && rep[l+d] !== null){ rep[l] = rep[l+d]; break; }
    }
  }
  const info = {levelOf, rep};
  layerPalettes.set(img, info);
  return info;
}

/* Remap an already-composited frame through a DMG palette byte. The scene is
   analysed per call because it changes every frame; only used by the rBGP
   effects, and only for the handful of palette values they cycle through. */
const compositeCache = {canvas: null, byte: null, stamp: -1};
let compositeStamp = 0;

function remapComposite(src, byte){
  const c = document.createElement("canvas");
  c.width = 160; c.height = 144;
  const ctx = c.getContext("2d", {willReadFrequently: true});
  ctx.drawImage(src, 0, 0);
  let img;
  try { img = ctx.getImageData(0, 0, 160, 144); } catch (e){ return src; }
  const d = img.data;
  const counts = new Map();
  const lum = k => ((k >> 16 & 255) * 299 + (k >> 8 & 255) * 587 + (k & 255) * 114) / 1000;
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] < 128) continue;
    const k = (d[i] << 16) | (d[i+1] << 8) | d[i+2];
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const cols = [...counts.keys()].sort((a, bb) => lum(bb) - lum(a));
  const levelOf = new Map();
  cols.forEach((k, i) => levelOf.set(k, cols.length <= 1 ? 0
    : Math.min(3, Math.round(i * 3 / (cols.length - 1)))));
  const rep = [null, null, null, null];
  for (const [k, lvl] of levelOf)
    if (rep[lvl] === null || counts.get(k) > counts.get(rep[lvl])) rep[lvl] = k;
  const map = palMap(byte);
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] < 128) continue;
    const lvl = levelOf.get((d[i] << 16) | (d[i+1] << 8) | d[i+2]);
    if (lvl === undefined) continue;
    const out = rep[map[lvl]] !== null ? rep[map[lvl]] : rep[lvl];
    if (out === null) continue;
    d[i] = out >> 16 & 255; d[i+1] = out >> 8 & 255; d[i+2] = out & 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function remapLayer(img, key, byte){
  if (byte === DMG_IDENTITY) return img;
  const id = key + ":" + byte;
  if (remapCache.has(id)) return remapCache.get(id);
  const info = analyseLayer(img);
  if (!info) return img;
  const map = palMap(byte);
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d", {willReadFrequently: true});
  ctx.drawImage(img, 0, 0);
  let d;
  try { d = ctx.getImageData(0, 0, c.width, c.height); }
  catch (e){ return img; }
  const px = d.data;
  for (let i = 0; i < px.length; i += 4){
    if (px[i+3] < 128) continue;
    const src = (px[i] << 16) | (px[i+1] << 8) | px[i+2];
    const lvl = info.levelOf.get(src);
    if (lvl === undefined) continue;
    const out = info.rep[map[lvl]] !== null && info.rep[map[lvl]] !== undefined
      ? info.rep[map[lvl]] : info.rep[lvl];
    if (out === null || out === undefined) continue;
    px[i] = out >> 16 & 255; px[i+1] = out >> 8 & 255; px[i+2] = out & 255;
  }
  ctx.putImageData(d, 0, 0);
  remapCache.set(id, c);
  return c;
}

function clearFB(){          // transparent: the scene shows through
  fb.data.fill(0);
}
function px(x, y, c){
  if (x < 0 || y < 0 || x >= 160 || y >= 144) return;
  const i = (y*160 + x) * 4;
  fb.data[i]=c[0]; fb.data[i+1]=c[1]; fb.data[i+2]=c[2]; fb.data[i+3]=255;
}

// InitBattleAnimBuffer: on the enemy's turn the coords are mirrored every
// frame (and the x offset negated), so this is done at draw time, not at spawn
function objDrawState(o, sim, animLabel){
  let x = o.x, y = o.y, xoff = o.xoff;
  let oamFlags = o.flags & 0x80;                       // player turn: PRIORITY only
  if (sim.turn){
    oamFlags = o.flags;
    if (o.flags & 1){
      const fix = D.coordFix || {mirrorX: 180, yAdd: 40};
      x = b(fix.mirrorX - o.x);
      if (o.fixY === 0xff) y = b(o.y + fix.yAdd);
      else {
        y = b(o.fixY - o.y);
        if (/_(Kinesis|Softboiled|MilkDrink)$/.test(animLabel || "")) y = b(y - 8);
      }
      xoff = b(-o.xoff);
    }
  }
  return {x, y, xoff, yoff: o.yoff, oamFlags};
}

function drawObj(o, sim){
  const f = o.cur;
  if (!f) return null;
  const oam = D.oamsets[f.oamset];
  if (!oam) return null;
  const tiles = TILES[o.def.gfx];
  // Tile ids in OAM data are relative to the object's own gfx set: on hardware
  // the id is tileDict[gfx] + oamset.vtile + entry.tile, and tileDict[gfx] is
  // exactly where that set was loaded into VRAM - so within the set's own
  // tiles the index is just oamset.vtile + entry.tile. (Adding tileDict here
  // ran every set after the first off the end of its file.)
  const base = oam.vtile;
  o.unloaded = sim.tileDict[o.def.gfx] === undefined;
  const pal = palFor(o.pal, sim.screen.objPalSet);
  /* BattleAnim_SetOBPals applies wOBP0 by copying just two CGB palettes,
     starting at PAL_BATTLE_OB_GRAY, so the gray/yellow cyclers recolour only
     objects using those two - everything else keeps its own colours. */
  const palIdx = D.palConsts[o.pal];
  const obpApplies = palIdx === D.palConsts.PAL_BATTLE_OB_GRAY ||
                     palIdx === D.palConsts.PAL_BATTLE_OB_YELLOW;
  const omap = palMap(obpApplies ? sim.screen.obp0 : DMG_IDENTITY);
  const st = objDrawState(o, sim, cur);
  o.drawX = st.x; o.drawY = st.y; o.drawXoff = st.xoff;
  // wBattleAnimTempOAMFlags = object flags xor this frame's flip flags
  const gX = ((st.oamFlags & 0x20) !== 0) !== !!f.xflip;
  const gY = ((st.oamFlags & 0x40) !== 0) !== !!f.yflip;
  const baseY = b(st.y + st.yoff), baseX = b(st.x + st.xoff);
  const box = {x0:999, y0:999, x1:-999, y1:-999};
  for (const e of oam.entries){
    let ey = e.y, ex = e.x;
    if (gY) ey = (-(ey + 8)) & 0xff;
    if (gX) ex = (-(ex + 8)) & 0xff;
    const sy = ey > 127 ? ey - 256 : ey, sx = ex > 127 ? ex - 256 : ex;
    const oy = ((baseY + sy) & 0xff) - 16, ox = ((baseX + sx) & 0xff) - 8;
    const xf = e.xflip !== gX;
    const yf = e.yflip !== gY;
    const t = base + e.tile;
    box.x0 = Math.min(box.x0, ox); box.y0 = Math.min(box.y0, oy);
    box.x1 = Math.max(box.x1, ox+8); box.y1 = Math.max(box.y1, oy+8);
    if (!tiles || (t+1)*64 > tiles.length){
      o.tileMiss = o.def.gfx + (tiles ? " tile $" + t.toString(16) : " (no tiles)");
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++)
        if ((x+y) % 2 === 0) px(ox+x, oy+y, [200,60,60]);
      continue;
    }
    for (let y = 0; y < 8; y++)
      for (let x = 0; x < 8; x++){
        const c = tiles[t*64 + (yf ? 7-y : y)*8 + (xf ? 7-x : x)];
        if (c === 0) continue;
        px(ox+x, oy+y, pal[omap[c]] || pal[c] || [0,0,0]);
      }
  }
  return box;
}

function render(){
  if (!D || !cur) return;
  const sim = loopPhase ? simAt(0) : simAt(frame);      // reset scene while holding
  clearFB();
  const boxes = [];
  // OAM priority: the object written first wins, so draw in reverse order and
  // let the earliest-queued particle end up on top
  for (let i = sim.objs.length - 1; i >= 0; i--){
    const o = sim.objs[i];
    const bx = drawObj(o, sim);
    if (bx && bx.x1 > -999) boxes.push({o, b: bx});
  }
  /* Every palette the frame needs, each rendered as a full scene so the
     backdrop and both mon pics go through their own colours - remapping the
     flattened frame instead would push the enemy's browns through a palette
     ranked across the whole screen. */
  const S0 = sim.screen;
  const palettes = new Map();
  const paletteAt = (row) => (S0.ly && S0.lyAxis === "bgp" && row >= 0 &&
                              row >= S0.lyStart && row <= S0.lyEnd)
    ? (S0.ly[row] & 0xff) : S0.bgp;
  const wanted = new Set([S0.bgp]);
  if (S0.ly && S0.lyAxis === "bgp")
    for (let r = 0; r < 144; r++) wanted.add(paletteAt(r));
  for (const byte of wanted){
    drawScene(sim, byte);
    if (wanted.size === 1 && byte === S0.bgp){ palettes.set(byte, off); break; }
    const c = document.createElement("canvas");
    c.width = 160; c.height = 144;
    c.getContext("2d").drawImage(off, 0, 0);
    palettes.set(byte, c);
  }
  const sceneFor = (byte) => palettes.get(byte) || palettes.get(S0.bgp) || off;
  if (wanted.size > 1) drawScene(sim, S0.bgp);      // leave off in a known state

  ovctx.putImageData(fb, 0, 0);
  sctx.imageSmoothingEnabled = false;
  octx.imageSmoothingEnabled = false;
  const S = sim.screen;

  // Uncovered scanlines are blank background, never black: an rSCY override of
  // $90 deliberately fetches lines from off the tilemap, which the hardware
  // draws as empty tiles.
  sctx.fillStyle = blankColour(S);
  sctx.fillRect(0, 0, screenEl.width, screenEl.height);

  /* Rows handed to sprites by anim_battlergfx_*row: copy them aside, blank
     them out of the background (ClearBox), and draw them back unwarped after
     the background blit - which is what makes them sit still. */
  // Lifting the rows onto the sprite layer only matters while something is
  // actually moving or recolouring the background; with nothing active it
  // would be a blank-and-redraw of identical pixels, so leave it alone.
  const rows = (S.ly || S.scx || S.scy) ? (S.picRows || []) : [];
  if (rows.length){
    rowctx.clearRect(0, 0, 160, 144);
    for (const r of rows){
      /* These are sprites drawn from the pic, so they take that battler's
         object palette. When a fade is running, the pic in the scene has
         already been drawn through it, so the default scene is the right
         source; otherwise fall back to wOBP1 or the lines they sit on. */
      const byte = (S.monPal && S.monPal[r.side] !== DMG_IDENTITY) ? S0.bgp
        : (S.spriteBGP !== null && S.spriteBGP !== undefined
            ? S.spriteBGP : paletteAt(r.y + (r.h >> 1) - 1));
      if (!palettes.has(byte)){
        drawScene(sim, byte);
        const c = document.createElement("canvas");
        c.width = 160; c.height = 144;
        c.getContext("2d").drawImage(off, 0, 0);
        palettes.set(byte, c);
        drawScene(sim, S0.bgp);
      }
      rowctx.drawImage(sceneFor(byte), r.x, r.y, r.w, r.h, r.x, r.y, r.w, r.h);
    }
    for (const [byte, c] of palettes){
      const ctx2 = c === off ? octx : c.getContext("2d");
      ctx2.fillStyle = blankColour(S, byte);   // blank tiles in that palette
      for (const r of rows) ctx2.fillRect(r.x, r.y, r.w, r.h);
    }
  }

  // hSCX / hSCY scroll the background, and the LY overrides displace it a
  // different amount on each scanline. Sprites (the anim objects) are not
  // affected by either, so they go on top unshifted.
  const sx0 = -(S.scx || 0), sy0 = -(S.scy || 0);
  if (S.ly && S.lyAxis === "bgp"){
    // the override feeds rBGP, so each scanline comes from the scene rendered
    // with that line's palette
    for (let dest = 0; dest < 144; dest++){
      const byte = (dest >= TEXTBOX_Y && $("#textbox").checked)
        ? S.bgp : paletteAt(dest - 1);    // the box keeps its own palette
      sctx.drawImage(sceneFor(byte), 0, dest, 160, 1,
                     sx0 * SCALE, (dest + sy0) * SCALE, 160 * SCALE, SCALE);
    }
  } else if (S.ly){
    // Walk the *destination* scanlines: the override on line L decides which
    // background line is fetched for it. Driving it from the source line
    // instead leaves gaps where consecutive offsets differ, which is where the
    // black scanlines came from on the rSCY effects.
    for (let dest = 0; dest < 144; dest++){
      /* The LCD STAT handler runs at the end of a line, so the value it
         writes to rSCX/rSCY takes effect on the *next* scanline: the entry
         for line L displaces line L+1. Without that delay a fill over lines
         47-94 dragged line 47 - the enemy pic's bottom row - along with the
         player's pic.

         The message box sits below the effect ranges, so the warps never
         reach it, but hSCX / hSCY still scroll it with the rest of the
         background, which is why shakes and wobbles move it. */
      const o = (dest >= TEXTBOX_Y && $("#textbox").checked)
        ? 0 : (dest > 0 ? (S.ly[dest - 1] || 0) : 0);
      if (S.lyAxis === "y"){
        const src = dest + o + (S.scy || 0);
        if (src < 0 || src > 143) continue;               // off the map: blank
        for (const wrap of BG_WRAPS)
          sctx.drawImage(sceneFor(S.bgp), 0, src, 160, 1,
                         (sx0 + wrap) * SCALE, dest * SCALE, 160 * SCALE, SCALE);
      } else {
        // The tilemap wraps at 256px, not at the 160px the screen shows. The
        // 96 columns past the visible area hold blank tiles, so a pic shifted
        // sideways slides off into blank space; only an offset past those 96
        // columns brings the row back round. Repeating every 160px instead
        // made Double Team's displaced scanlines reappear on the far side.
        for (const wrap of BG_WRAPS)
          sctx.drawImage(sceneFor(S.bgp), 0, dest, 160, 1,
                         (sx0 - o + wrap) * SCALE, (dest + sy0) * SCALE,
                         160 * SCALE, SCALE);
      }
    }
  } else {
    sctx.drawImage(sceneFor(S.bgp), sx0 * SCALE, sy0 * SCALE,
                   screenEl.width, screenEl.height);
  }
  if (rows.length)
    sctx.drawImage(rowc, 0, 0, screenEl.width, screenEl.height);
  sctx.drawImage(ov, 0, 0, screenEl.width, screenEl.height);

  sctx.save();
  sctx.scale(SCALE, SCALE);
  if ($("#grid").checked){
    sctx.strokeStyle = "rgba(0,0,0,.12)"; sctx.lineWidth = 1/SCALE;
    for (let x = 0; x <= 160; x += 8){ sctx.beginPath(); sctx.moveTo(x,0); sctx.lineTo(x,144); sctx.stroke(); }
    for (let y = 0; y <= 144; y += 8){ sctx.beginPath(); sctx.moveTo(0,y); sctx.lineTo(160,y); sctx.stroke(); }
  }
  if ($("#boxes").checked){
    const t = +$("#turn").value;
    for (const r of monRects()){
      const isTarget = r.k === "target";
      const col = isTarget ? "rgba(90,130,60,.9)" : "rgba(70,110,160,.9)";
      const txt = (isTarget !== !!t) ? "target" : "user";
      sctx.setLineDash([2,2]); sctx.lineWidth = 1/SCALE; sctx.strokeStyle = col;
      sctx.strokeRect(r.x+.5, r.y+.5, r.w-1, r.h-1);
      sctx.setLineDash([]); sctx.fillStyle = col; sctx.font = "6px monospace";
      sctx.fillText(txt + " " + r.x + "," + r.y, r.x+2, r.y+8);
    }
  }
  if ($("#marks").checked){
    for (const {o, b: bx} of boxes){
      const on = sel >= 0 && o.at && o.at.label === cur && o.at.ip === sel;
      sctx.strokeStyle = on ? "#8bc34a" : "rgba(90,176,232,.5)";
      sctx.lineWidth = 1/SCALE;
      sctx.strokeRect(bx.x0+.5, bx.y0+.5, bx.x1-bx.x0-1, bx.y1-bx.y0-1);
      sctx.fillStyle = on ? "#8bc34a" : "rgba(90,176,232,.7)";
      const ax = b(o.drawX + o.drawXoff) - 8, ay = b(o.drawY + o.yoff) - 16;
      sctx.beginPath(); sctx.arc(ax, ay, 1.5, 0, 7); sctx.fill();
      if (on){ sctx.font = "6px monospace"; sctx.fillText(o.x + "," + o.y, bx.x0, bx.y0 - 2); }
    }
  }
  sctx.restore();
  const vbTotal = (tickVblanks || []).reduce((a, c) => a + c, 0) || maxFrame;
  $("#frameno").textContent =
    loopPhase === "sfx" ? "waiting for sfx"
    : loopPhase === "delay" ? "loop in " + (loopWait / 60).toFixed(1) + "s"
    : "f " + frame + " / " + maxFrame +
      (vbTotal > maxFrame ? "  (" + vbTotal + " vbl)" : "");
  drawTimeline();
  highlightActive(sim);
  const funcs = [...new Set(sim.objs
    .filter(o => o.def.func && !/NULL/.test(o.def.func))
    .map(o => {
      const i = D.consts[o.def.func];
      const name = i !== undefined ? ANIM_FUNC_ORDER[i] : null;
      const known = name && AF[name];
      return o.def.func + (o.funcErr ? " ⚠" : (known ? "" : " (not simulated)"));
    }))];
  const unloaded = [...new Set(sim.objs.filter(o => o.unloaded).map(o => o.def.gfx))];
  let legend = "";
  if (funcs.length)
    legend += "active object functions:<br>" +
      funcs.map(f => '<span class="chip">' + f.replace("BATTLE_ANIM_FUNC_","") + "</span>").join("");
  if (unloaded.length)
    legend += (legend ? "<br>" : "") +
      '<span style="color:var(--bad)">gfx not loaded by this script — add it to anim_Ngfx:</span><br>' +
      unloaded.map(g => '<span class="chip">' + g.replace("BATTLE_ANIM_GFX_","") + "</span>").join("");
  const bgActive = [...new Set(sim.bgfx.filter(Boolean).map(e =>
    e.name.replace("BATTLE_BG_EFFECT_","") + (e.unknown ? " (not simulated)" : "")))];
  if (bgActive.length)
    legend += (legend ? "<br>" : "") + "bg effects:<br>" +
      bgActive.map(x => '<span class="chip">' + x + "</span>").join("");
  const misses = [...new Set(sim.objs.map(o => o.tileMiss).filter(Boolean))];
  if (misses.length)
    legend += (legend ? "<br>" : "") +
      '<span style="color:var(--bad)">missing tiles (red checks):</span><br>' +
      misses.map(m => '<span class="chip">' + m.replace("BATTLE_ANIM_GFX_","") + "</span>").join("");
  $("#legend").innerHTML = legend;
}

// the colour blank background tiles come out as, through the current palette
function blankColour(S, byte){
  const bgp = byte === undefined ? S.bgp : byte;
  const info = (scene.bg && bgImg) ? analyseLayer(bgImg) : null;
  if (info){
    const c = info.rep[palMap(bgp)[0]];
    if (c !== null && c !== undefined)
      return "rgb(" + (c >> 16 & 255) + "," + (c >> 8 & 255) + "," + (c & 255) + ")";
  }
  return ["#e8f0d8", "#a8b088", "#506040", "#101810"][palMap(bgp)[0]];
}

/* A swapped pic is assembled the way GetSubstitutePic does it: a blank square
   of base x base tiles with the doll's (or the minimize pic's) tiles dropped
   into their slots. Index 0 is the blank the scratch buffer was cleared to,
   and it renders as pure white rather than the backdrop's cream, because the
   cleared scratch is genuinely colour 0 with nothing behind it.

   The doll itself is drawn in the colours of the mon using it: the pic layer's
   own analysed levels, so level 1 and 2 - the body's primary and secondary -
   carry over and the substitute reads as that mon's stand-in. The minimize pic
   is a solid silhouette, so it keeps the flat GB shades. */
const SWAP_SHADES = ["#ffffff", "#a8b088", "#506040", "#101810"];
const hex = k => "#" + ((k >>> 0) & 0xffffff).toString(16).padStart(6, "0");
const swapPicCache = new Map();               // "kind:side:shiny:byte" -> canvas
function swapPic(kind, side, byte, monImg){
  const layout = (PIC_SWAPS[kind] || {})[side];
  const tiles = D && D.picSwapTiles ? D.picSwapTiles[kind] : null;
  if (!layout || !tiles || !tiles.length) return null;
  const shiny = !!monShiny[side];
  const key = kind + ":" + side + ":" + (shiny ? "s" : "n") + ":" + byte;
  if (swapPicCache.has(key)) return swapPicCache.get(key);
  const base = layout.base, px = base * 8;
  const c = document.createElement("canvas");
  c.width = px; c.height = px;
  const cx = c.getContext("2d");
  const map = palMap(byte);
  let shade = SWAP_SHADES;
  /* Raising a substitute swaps the pic, not the palette - the battler's BG
     palette is left alone - so the doll comes out in the colours of the mon
     that raised it. Those are the repo's own four entries for that species,
     with the blank kept pure white because the scratch buffer it is drawn
     into is cleared to colour 0. */
  const pic = kind === "sub" ? monPicStore[side] : null;
  if (pic){
    const p = shiny ? pic.shinyPal : pic.pal;
    shade = ["#ffffff", hex(p[1]), hex(p[2]), hex(p[3])];
  } else if (kind === "sub" && monImg){
    const info = analyseLayer(monImg);         // fallback: a loaded screenshot
    if (info && info.rep)
      shade = ["#ffffff", hex(info.rep[1]), hex(info.rep[2]), hex(info.rep[3])];
  }
  cx.fillStyle = shade[map[0]];               // the cleared scratch buffer
  cx.fillRect(0, 0, px, px);
  for (const cell of layout.cells){
    const t = tiles[cell.src];
    if (!t) continue;
    for (let y = 0; y < 8; y++)
      for (let x = 0; x < 8; x++){
        const v = t[y * 8 + x];
        if (v === 0) continue;                // blank stays blank
        cx.fillStyle = shade[map[v & 3]];
        cx.fillRect(cell.col * 8 + x, cell.row * 8 + y, 1, 1);
      }
  }
  swapPicCache.set(key, c);
  return c;
}

/* The full-size pic box for a side, from RunPicResizeScript's own tables: the
   square whose width matches the base, at the coord sharing its index. The
   screenshot the preview normally draws is positioned for the capture rather
   than for the game's tile grid - the player's asset is 56px at y 40 where the
   real box is 48px at y 48 - so a swapped pic is placed by these coords
   instead, or it sits a row too high. */
function swapPicBox(side, base){
  const {squares, coords} = BG_PIC_RESIZE;
  for (let i = 0; i < squares.length; i++)
    if (squares[i].base === base && squares[i].w === base && coords[i])
      return {x: coords[i].x * 8, y: coords[i].y * 8};
  return null;
}
/* How many tiles across this side's pic is, taken from the largest square its
   EnterMon script grows to rather than assumed: 6 for the player's slot, 7 for
   the enemy's in both repos. */
function picBase(side){
  const script = (BG_PIC_RESIZE.scripts.EnterMon || {})[side] || [];
  let best = 0;
  for (const st of script){
    const sq = BG_PIC_RESIZE.squares[st.op];
    if (sq && sq.w > best) best = sq.w;
  }
  return best || (side === 0 ? 7 : 6);
}

/* BattleAnimCmd_Transform loads the *other* battler's species over the actor's
   own pic, and in the orientation that slot needs - the enemy's slot gets
   GetMonFrontpic of the player's mon, the player's slot GetMonBackpic of the
   enemy's. Both go to vTiles0, so like anim_minimize the change only shows
   once anim_updateactorpic copies the staging buffer across.

   The palette does not follow the pic. Transform swaps the graphics only;
   nothing reloads this battler's BG palette, so a transformed mon keeps its
   own colours over the other's shape - which is the giveaway on hardware too.
   The other side's shiny flag is likewise irrelevant here. */
const transformPicCache = new Map();          // "side:shiny:byte" -> canvas
function transformPic(side, byte){
  const other = MON_TRANSFORM[side];           // the other species, this facing
  const mine = monPicStore[side];              // whose palette we keep
  if (!other || !mine) return null;
  const shiny = !!monShiny[side];
  const ck = side + ":" + (shiny ? "s" : "n") + ":" + byte;
  if (transformPicCache.has(ck)) return transformPicCache.get(ck);
  const base = picBase(side), px = base * 8;
  const pal = shiny ? mine.shinyPal : mine.pal;
  const map = palMap(byte);
  const c = document.createElement("canvas");
  c.width = px; c.height = px;
  const cx = c.getContext("2d");
  const out = cx.createImageData(px, px);
  const put = (o, v) => {
    out.data[o] = (v >> 16) & 0xff; out.data[o+1] = (v >> 8) & 0xff;
    out.data[o+2] = v & 0xff; out.data[o+3] = 255;
  };
  const blank = pal[map[0]];
  for (let i = 0; i < px * px; i++) put(i * 4, blank);
  const off = other.back ? {x: 0, y: 0} : frontPicOffset(other.size);
  for (let y = 0; y < other.h; y++){
    const dy = y + off.y;
    if (dy < 0 || dy >= px) continue;
    for (let x = 0; x < other.w; x++){
      const dx = x + off.x;
      if (dx >= 0 && dx < px) put((dy * px + dx) * 4, pal[map[other.idx[y*other.w + x] & 3]]);
    }
  }
  cx.putImageData(out, 0, 0);
  transformPicCache.set(ck, c);
  return c;
}
// the pic each slot shows after Transform: the other species in this facing
let MON_TRANSFORM = [null, null];
let monPick = [0, 0];                  // dex index chosen per side

/* --------------------------------------------------------- the HUD names --
   The names in the backdrop are part of the screenshot, so changing the
   selected species means repainting them. Everything needed is in the repo:
   the charmap gives the byte for each character, gfx/font/font.png holds the
   glyphs ($80 is its first tile, so a byte indexes it directly), and
   engine/battle/core.asm gives the two coordinates - DrawEnemyHUD places the
   enemy nickname and PrintPlayerHUD the player's.

   The names go into the backdrop layer *before* the palette remap rather than
   on top of the finished frame, so they invert and fade along with the rest of
   the HUD, which is what the hardware does: the name boxes sit in the seven BG
   palettes BattleAnim_SetBGPals rewrites, not the message box's exempt one. */
let CHARMAP = [];                      // [[text, byte]], longest first
let FONT_TILES = null;                 // 128 tiles of 64 ink flags
let HUD_NAME_AT = {0: {x: 1, y: 0}, 1: {x: 10, y: 7}};   // tile coords

function parseCharmap(text){
  const out = [];
  for (const raw of (text || "").split("\n")){
    const m = raw.match(/^\s*charmap\s+"((?:[^"\\]|\\.)*)"\s*,\s*(\$[0-9a-fA-F]+|\d+)/);
    if (!m) continue;
    const lit = m[1].replace(/\\"/g, '"').replace(/\\\\/g, "\\");
    out.push([lit, num(m[2])]);
  }
  out.sort((a, b) => b[0].length - a[0].length);   // greedy longest match
  return out;
}

// the hlcoord that immediately precedes the PlaceString in a HUD routine
function parseHudNameCoords(text){
  const at = {};
  const grab = (label, side) => {
    const i = text.indexOf("\n" + label + ":");
    if (i < 0) return;
    const body = text.slice(i, i + 4000);
    const stop = body.indexOf("PlaceString");
    if (stop < 0) return;
    const coords = [...body.slice(0, stop).matchAll(/hlcoord\s+(\d+)\s*,\s*(\d+)/g)];
    const last = coords[coords.length - 1];
    if (last) at[side] = {x: +last[1], y: +last[2]};
  };
  grab("DrawEnemyHUD", 0);
  grab("PrintPlayerHUD", 1);
  return Object.keys(at).length === 2 ? at : null;
}

async function loadFont(repo, file){
  if (!file) return null;
  try {
    const img = await loadImageRGBA(await repo.bytes(file));
    const cols = img.w / 8, tiles = [];
    for (let t = 0; t < cols * (img.h / 8); t++){
      const tx = (t % cols) * 8, ty = ((t / cols) | 0) * 8;
      const g = new Uint8Array(64);
      for (let y = 0; y < 8; y++)
        for (let x = 0; x < 8; x++)
          g[y*8 + x] = img.rgba[((ty + y) * img.w + tx + x) * 4] < 128 ? 1 : 0;
      tiles.push(g);
    }
    return tiles;
  } catch (e){ return null; }
}

function encodeName(s){
  const out = [];
  for (let i = 0; i < s.length; ){
    const hit = CHARMAP.find(([lit]) => lit.length && s.startsWith(lit, i));
    if (hit){ out.push(hit[1]); i += hit[0].length; }
    else i++;                                   // unmappable: skip it
  }
  return out;
}

const NAME_FIELD_TILES = 10;           // NAME_LENGTH - 1, the widest a name gets

/* Repaint both names onto a copy of the backdrop. Ink and paper come from the
   screenshot's own analysed levels so a differently captured backdrop still
   matches, rather than assuming pure black on pure white. */
function backdropWithNames(src){
  if (!src) return src;
  const c = document.createElement("canvas");
  c.width = 160; c.height = 144;
  const cx = c.getContext("2d", {willReadFrequently: true});
  cx.drawImage(src, 0, 0, 160, 144);
  if (!FONT_TILES || !MON_LIST.length) return c;
  const info = analyseLayer(src);
  const paper = info && info.rep ? info.rep[0] : 0xffffff;
  const ink   = info && info.rep ? info.rep[3] : 0x000000;
  const css = v => "#" + ((v >>> 0) & 0xffffff).toString(16).padStart(6, "0");
  for (const side of [0, 1]){
    const entry = MON_LIST[monPick[side]];
    const at = HUD_NAME_AT[side];
    if (!entry || !at) continue;
    const x0 = at.x * 8, y0 = at.y * 8;
    cx.fillStyle = css(paper);                  // ClearBox over the old name
    cx.fillRect(x0, y0, Math.min(NAME_FIELD_TILES * 8, 160 - x0), 8);
    cx.fillStyle = css(ink);
    encodeName(entry.name).slice(0, NAME_FIELD_TILES).forEach((code, i) => {
      const g = FONT_TILES[code - 0x80];
      if (!g) return;
      for (let y = 0; y < 8; y++)
        for (let x = 0; x < 8; x++)
          if (g[y*8 + x]) cx.fillRect(x0 + i*8 + x, y0 + y, 1, 1);
    });
  }
  return c;
}

/* Load both slots. Each side needs two pics: its own facing for the slot, and
   the other side's facing for what Transform swaps in. Side 0 is the enemy
   slot (frontpics), side 1 the player's (backpics). */
let monLoadSeq = 0;
async function loadMonPics(){
  if (!REPO || !MON_LIST.length) return;
  // arrow-key stepping can start a reload before the last one finished; only
  // the newest may publish, or a slower earlier pic overwrites the current one
  const seq = ++monLoadSeq;
  monPicCanvas.clear(); transformPicCache.clear(); swapPicCache.clear();
  for (const side of [0, 1]){
    const entry = MON_LIST[monPick[side]];
    if (!entry) continue;
    const back = side === 1;
    monPicError[side] = null;
    try {
      monPicStore[side] = await loadMonPic(REPO, entry, back);
    } catch (e){ monPicStore[side] = null; }
    if (!monPicStore[side]) monPicError[side] = await picFailReason(REPO, entry, back);
  }
  // Transform: this slot's facing, the other slot's species
  for (const side of [0, 1]){
    const entry = MON_LIST[monPick[side === 1 ? 0 : 1]];
    if (!entry) continue;
    try {
      MON_TRANSFORM[side] = await loadMonPic(REPO, entry, side === 1);
    } catch (e){ MON_TRANSFORM[side] = null; }
  }
  if (seq !== monLoadSeq) return;              // superseded
  // the HUD names live in the backdrop, so they are repainted with it
  bgImg = backdropWithNames(bgSrc);
  remapCache.clear();
}
// vTiles2 can hold any of the replacement pics; this resolves one to a canvas
function picSwapCanvas(kind, side, byte, monImg){
  if (kind === "transform") return transformPic(side, byte);
  return swapPic(kind, side, byte, monImg);
}

/* Why each slot has no pic, filled in by loadMonPics. */
let monPicError = [null, null];

/* Painted into a slot in place of the pic. The game font is used when the
   repo has given us one, so it reads like the rest of the screen; otherwise
   a plain canvas font stands in. The box is only 48 or 56 pixels wide, so
   the text wraps to whole tiles and the message has to stay terse - the load
   log carries the per-file detail. */
function drawPicNotice(side, msg){
  const base = picBase(side), px = base * 8;
  const box = swapPicBox(side, base) || {x: side === 1 ? 16 : 96, y: side === 1 ? 48 : 0};
  octx.save();
  octx.strokeStyle = "#c04040";
  octx.setLineDash([2, 2]);
  octx.lineWidth = 1;
  octx.strokeRect(box.x + 0.5, box.y + 0.5, px - 1, px - 1);
  octx.setLineDash([]);

  const cols = base - 1;                       // one tile of padding each side
  const words = String(msg).toUpperCase().split(/\s+/);
  const lines = [];
  for (const w of words){
    const last = lines[lines.length - 1];
    if (last !== undefined && (last + " " + w).length <= cols) lines[lines.length - 1] = last + " " + w;
    else for (let i = 0; i < w.length; i += cols) lines.push(w.slice(i, i + cols));
  }
  const rows = Math.min(lines.length, base - 1);
  let y = box.y + Math.max(4, ((px - rows * 8) >> 1));

  if (FONT_TILES && CHARMAP.length){
    octx.fillStyle = "#c04040";
    for (let r = 0; r < rows; r++){
      const codes = encodeName(lines[r]).slice(0, cols);
      let x = box.x + ((px - codes.length * 8) >> 1);
      for (const code of codes){
        const g = FONT_TILES[code - 0x80];
        if (g)
          for (let gy = 0; gy < 8; gy++)
            for (let gx = 0; gx < 8; gx++)
              if (g[gy * 8 + gx]) octx.fillRect(x + gx, y + gy, 1, 1);
        x += 8;
      }
      y += 8;
    }
  } else {
    octx.fillStyle = "#c04040";
    octx.font = "6px monospace";
    octx.textAlign = "center";
    for (let r = 0; r < rows; r++){ octx.fillText(lines[r], box.x + px / 2, y + 6); y += 8; }
  }
  octx.restore();
}

function drawMon(img, x, y, i, S, key, bgp){
  if (!S.monVisible[i]) return;
  // a mon's own palette (set by the fades) wins over the screen-wide one
  const mine = S.monPal && S.monPal[i] !== DMG_IDENTITY
    ? S.monPal[i] : (bgp === undefined ? S.bgp : bgp);
  /* anim_raisesub / anim_minimize replace what vTiles2 holds for this pic, so
     everything downstream - the resize squares, the warps, the fades - acts on
     the replacement instead of the mon. It is already palette-mapped, so it
     skips remapLayer. */
  const swap = S.monPicSwap && S.monPicSwap[i];
  const swapped = swap ? picSwapCanvas(swap, i, mine, img) : null;
  // repo pics are exact: indices through their own palette, no re-ranking
  const own = swapped ? null : monCanvas(i, mine);
  /* No repo pic and no swap means this species' png could not be used. There
     is no placeholder to fall back on any more - a stand-in sprite just looks
     like the wrong mon loaded - so the slot says what is wrong instead. */
  if (!swapped && !own){
    drawPicNotice(i, monPicError[i] || "no pic");
    return;
  }
  const box = swapPicBox(i, (swapped || own).width / 8);
  if (box){ x = box.x; y = box.y; }           // place it on the game's grid
  const srcImg = swapped || own;
  img = swapped || own;
  /* RunPicResizeScript redraws the pic as a smaller square of tiles, and the
     smaller squares are subsamples rather than scaled copies: FourByFour
     keeps tile rows and columns 0, 2, 3, 5 of the 6x6 pic and drops 1 and 4.
     So each destination tile is blitted from the source tile its table names,
     with the tile index running column-major over the full pic. */
  const rz = S.monResize && S.monResize[i];
  if (rz && rz.sq && rz.sq.tiles.length){
    const {sq} = rz, base = sq.base;
    const tw = srcImg.width / base, th = srcImg.height / base;
    const dx0 = (S.monDX[i] || 0), dy0 = (S.monDY[i] || 0);
    for (let r = 0; r < sq.tiles.length; r++){
      const row = sq.tiles[r];
      for (let c = 0; c < row.length; c++){
        const idx = row[c];
        const sc = Math.floor(idx / base), sr = idx % base;
        octx.drawImage(img, sc * tw, sr * th, tw, th,
                       rz.x + dx0 + c * 8, rz.y + dy0 + r * 8, 8, 8);
      }
    }
    return;
  }
  img = {width: srcImg.width, height: srcImg.height, src: img};
  const dx = S.monDX[i] || 0, dy = S.monDY[i] || 0;
  const clip = Math.max(0, Math.min(img.height, img.height - (S.monClipBottom[i] || 0)));
  const squash = S.monSquash[i] || 0;
  const h = Math.round(clip * (1 - squash));
  const draw = (ox, oy, alpha) => {
    octx.globalAlpha = alpha;
    octx.drawImage(img.src, 0, 0, img.width, clip, x + ox, y + oy + (clip - h), img.width, h);
    octx.globalAlpha = 1;
  };
  const ghost = S.monGhost[i] || 0;
  if (ghost) { draw(dx + ghost, dy, 0.45); draw(dx - ghost, dy, 0.45); }
  draw(dx, dy, 1);
  const tint = S.monTint[i];
  if (tint && tint[1] > 0.01){
    octx.save();
    octx.globalCompositeOperation = "source-atop";
    octx.globalAlpha = Math.min(1, tint[1]);
    octx.fillStyle = tint[0] === "light" ? "#ffffff" : "#101810";
    octx.fillRect(x + dx, y + dy, img.width, clip);
    octx.restore();
  }
}

function drawScene(sim, paletteByte){
  const S = sim ? sim.screen : newScreenState();
  const bgp = paletteByte === undefined ? S.bgp : paletteByte;
  octx.imageSmoothingEnabled = false;
  octx.clearRect(0, 0, 160, 144);
  if (scene.bg && bgImg){
    octx.drawImage(remapLayer(bgImg, "bg", bgp), 0, 0, 160, 144);
    if ($("#textbox").checked)             // message box keeps its palette
      octx.drawImage(bgImg, 0, TEXTBOX_Y, 160, 144 - TEXTBOX_Y,
                     0, TEXTBOX_Y, 160, 144 - TEXTBOX_Y);
  }
  else {
    const flat = palMap(bgp)[0];
    octx.fillStyle = ["#e8f0d8", "#a8b088", "#506040", "#101810"][flat];
    octx.fillRect(0, 0, 160, 144);
  }
  /* ClearActorHud: the attacker's own name and HP box are blanked for the
     whole animation - player's turn clears the box at tile (9,7), 11x5 tiles;
     the enemy's clears (1,0), 10x4 - and restored afterwards. */
  // ...but only while the script is actually running: BattleAnimRestoreHuds
  // runs the moment it returns, before the sound has finished
  const animRunning = sim && sim.frame > 0 && !sim.done && !loopPhase;
  if (scene.bg && animRunning && $("#hud").checked){
    const box = sim && sim.turn
      ? {x: 1 * 8, y: 0 * 8, w: 10 * 8, h: 4 * 8}
      : {x: 9 * 8, y: 7 * 8, w: 11 * 8, h: 5 * 8};
    octx.fillStyle = blankColour(S, bgp);     // ClearBox writes blank tiles
    octx.fillRect(box.x, box.y, box.w, box.h);
  }

  if (scene.target) drawMon(targetImg, scene.tx, scene.ty, 0, S, "target", bgp);
  if (scene.user) drawMon(userImg, scene.ux, scene.uy, 1, S, "user", bgp);

}

function drawTimeline(){
  const w = Math.max(320, tlc.clientWidth || 800);
  if (tlc.width !== w) tlc.width = w;
  const h = tlc.height;
  tctx.clearRect(0, 0, w, h);
  const sx = f => 34 + (w - 44) * (f / Math.max(1, maxFrame));
  tctx.strokeStyle = "#2e3440";
  tctx.beginPath(); tctx.moveTo(0, h-12); tctx.lineTo(w, h-12); tctx.stroke();
  tctx.font = "10px monospace";
  const stepf = Math.max(1, Math.round(maxFrame/16/5)*5);
  for (let f = 0; f <= maxFrame; f += stepf){
    tctx.fillStyle = "#4a5364"; tctx.fillRect(sx(f), h-15, 1, 5);
    tctx.fillStyle = "#6b7484"; tctx.fillText(f, sx(f)+2, h-3);
  }
  for (const e of (timeline||[])){
    tctx.fillStyle = e.k === "obj" ? "#8bc34a" : e.k === "sfx" ? "#e8b04b" : "#5ab0e8";
    tctx.fillRect(sx(e.f), e.k === "obj" ? 6 : e.k === "sfx" ? 16 : 26, 2, 7);
  }
  tctx.fillStyle = "#e8685a"; tctx.fillRect(sx(frame), 2, 1, h-14);
  tctx.fillStyle = "#6b7484";
  tctx.fillText("obj", 4, 12); tctx.fillText("sfx", 4, 22); tctx.fillText("bg", 4, 32);
}

/* ----------------------------------------------------------------- lists */

function buildList(){
  const q = $("#filter").value.toLowerCase();
  const out = ['<div class="head">moves &amp; anims</div>'];
  const seen = new Set();
  for (const e of D.table){
    if (seen.has(e.label)) continue;
    seen.add(e.label);
    const name = e.name || e.label;
    if (q && !(name.toLowerCase().includes(q) || e.label.toLowerCase().includes(q))) continue;
    out.push('<div class="row' + (e.label === cur ? " sel" : "") + (dirty.has(e.label) ? " dirty" : "") +
      '" data-l="' + e.label + '"><span class="idx">' + String(e.index).padStart(3,"0") + "</span>" + name + "</div>");
  }
  const subs = D.blockOrder.filter(l => !seen.has(l));
  if (subs.length){
    out.push('<div class="head">subroutines</div>');
    for (const l of subs){
      if (q && !l.toLowerCase().includes(q)) continue;
      out.push('<div class="row' + (l === cur ? " sel" : "") + (dirty.has(l) ? " dirty" : "") +
        '" data-l="' + l + '">' + l.replace("BattleAnimSub_","· ") + "</div>");
    }
  }
  $("#items").innerHTML = out.join("");
  $("#items").querySelectorAll(".row").forEach(r => r.onclick = () => select(r.dataset.l));
}

function select(label){
  cur = label; sel = -1; frame = 0; playing = false; loopPhase = null;
  $("#play").textContent = "▶ play";
  if (typeof stopSfx === "function") stopSfx();
  buildList(); buildCmds(); buildTimeline();
  $("#raw").value = serialize(cur);
  render();
  $("#status").textContent = REPO.name + " — " + D.blocks[cur].labels.join(" / ");
}

/* -------------------------------------------------------- command editor */

function snapshot(){
  undoStack.push({label:cur, items: JSON.parse(JSON.stringify(items(cur)))});
  if (undoStack.length > 60) undoStack.shift();
}
function touched(){
  dirty.add(cur); buildList(); buildTimeline();
  $("#raw").value = serialize(cur);
  if (frame > maxFrame) frame = maxFrame;
  render();
}
const opts = (list, val) =>
  list.map(o => '<option' + (o === val ? " selected" : "") + ">" + o + "</option>").join("");

function buildCmds(){
  const it = items(cur), rows = [];
  let t = 0;
  for (let i = 0; i < it.length; i++){
    const e = it[i];
    let cell = "", args = "";
    if (e.t === "cmd"){
      cell = '<td class="c' + (FLOW.has(e.cmd) ? " flow" : "") + '">' + e.cmd + "</td>";
      args = argFields(e, i);
    } else if (e.t === "label") cell = '<td class="c"><span class="lbl">' + e.name + "</span></td>";
    else if (e.t === "comment") cell = '<td class="c"><span class="cmt">; ' + e.text + "</span></td>";
    else if (e.t === "raw") cell = '<td class="c"><span class="cmt">' + e.text.trim() + "</span></td>";
    else cell = '<td class="c"></td>';
    if (e.t === "cmd" && e.cmd === "anim_wait") t += nv(e.args[0]);
    rows.push('<tr data-ip="' + i + '"' + (i === sel ? ' class="sel"' : "") + '>' +
      '<td class="t">' + (e.t === "cmd" && e.cmd === "anim_wait" ? t : "") + "</td>" + cell +
      '<td class="a">' + args + "</td>" +
      '<td class="b">' +
        ['up','↑','down','↓','dup','⧉','del','✕'].reduce((acc,_,k,arr) =>
          k % 2 ? acc + '<button class="sm" data-act="' + arr[k-1] + '" data-i="' + i + '">' + arr[k] + "</button>" : acc, "") +
      "</td></tr>");
  }
  $("#cmdview").innerHTML = '<table class="cmds"><tbody>' + rows.join("") + "</tbody></table>";
  wireCmds();
}

// palette constants of one family, in index order, for the arg dropdowns
function palNames(prefix){
  return Object.entries(D.palConsts || {})
    .filter(([k]) => k.startsWith(prefix))
    .sort((x, y) => x[1] - y[1])
    .map(([k]) => k);
}

function argFields(e, i){
  const a = e.args || [];
  const f = (idx, kind, extra) => {
    const head = 'data-i="' + i + '" data-a="' + idx + '" class="arg"';
    if (kind === "obj") return "<select " + head + ">" + opts(D.objNames.filter(Boolean), (a[idx]||"").trim()) + "</select>";
    if (kind === "sfx") return "<select " + head + ">" + opts(D.sfx, (a[idx]||"").trim()) + "</select>";
    if (kind === "gfx") return "<select " + head + ">" + opts(D.gfxNames.filter(Boolean), (a[idx]||"").trim()) + "</select>";
    if (kind === "bg")  return "<select " + head + ">" + opts(D.bgEffects.filter(Boolean), (a[idx]||"").trim()) + "</select>";
    if (kind === "obpal")  return "<select " + head + ">" + opts(palNames("PAL_BATTLE_OB_"), (a[idx]||"").trim()) + "</select>";
    if (kind === "bgpal")  return "<select " + head + ">" + opts(palNames("PAL_BATTLE_BG_"), (a[idx]||"").trim()) + "</select>";
    if (kind === "custom") return "<select " + head + ">" + opts(palNames("PAL_BTLCUSTOM_"), (a[idx]||"").trim()) + "</select>";
    if (kind === "num") return '<input type="number" ' + head + ' value="' + nv(a[idx]) + '">';
    return '<input ' + head + ' style="width:' + (extra||90) + 'px" value="' + (a[idx]||"") + '">';
  };
  const lab = s => '<span class="chip">' + s + "</span>";
  switch (e.cmd){
    case "anim_obj": {
      const c = objCoords(e);
      const coord = (role, v) =>
        '<input type="number" class="coord" data-i="' + i + '" data-role="' + role +
        '" value="' + v + '">';
      return f(0,"obj") + " " + lab("x") + coord("x", c.x) + lab("y") + coord("y", c.y) +
        lab("param") + f(c.legacy ? 5 : 3, "txt", 50) +
        (c.legacy ? '<span class="chip">tile form</span>' : "");
    }
    case "anim_wait": return f(0,"num") + " " + lab("frames");
    case "anim_sound": return lab("dur") + f(0,"num") + lab("tracks") + f(1,"num") + " " + f(2,"sfx");
    case "anim_1gfx": return f(0,"gfx");
    case "anim_2gfx": return f(0,"gfx") + " " + f(1,"gfx");
    case "anim_3gfx": return f(0,"gfx") + " " + f(1,"gfx") + " " + f(2,"gfx");
    case "anim_4gfx": return f(0,"gfx") + " " + f(1,"gfx") + " " + f(2,"gfx") + " " + f(3,"gfx");
    case "anim_5gfx": return f(0,"gfx") + " " + f(1,"gfx") + " " + f(2,"gfx") + " " + f(3,"gfx") + " " + f(4,"gfx");
    case "anim_bgeffect": return f(0,"bg") + " " + f(1,"txt",50) + f(2,"txt",50) + f(3,"txt",50);
    case "anim_incbgeffect": return f(0,"bg");
    // Sour Crystal: overwrite a palette slot with one of the custom palettes
    case "anim_setobjpal": return f(0,"obpal") + " " + lab("becomes") + f(1,"custom");
    case "anim_setbgpal":  return f(0,"bgpal") + " " + lab("becomes") + f(1,"custom");
    default: return (e.args||[]).map((_,k) => f(k,"txt",110)).join(" ");
  }
}

function wireCmds(){
  $("#cmdview").querySelectorAll("tr").forEach(tr => {
    tr.addEventListener("mousedown", ev => {
      if (ev.target.closest("button,input,select")) return;
      sel = +tr.dataset.ip; buildCmds(); render();
    });
  });
  $("#cmdview").querySelectorAll(".coord").forEach(el => {
    el.addEventListener("change", () => {
      snapshot();
      const it = items(cur)[+el.dataset.i];
      const c = objCoords(it);
      const v = nv(el.value);
      setObjCoords(it, el.dataset.role === "x" ? v : c.x, el.dataset.role === "y" ? v : c.y);
      touched();
    });
  });
  $("#cmdview").querySelectorAll(".arg").forEach(el => {
    el.addEventListener("change", () => {
      snapshot();
      items(cur)[+el.dataset.i].args[+el.dataset.a] = el.value;
      if (/^SFX_/.test(el.value) && $("#sound").checked){ audioCtx(); playSfx(el.value); }
      touched();
    });
  });
  $("#cmdview").querySelectorAll("button[data-act]").forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.i, list = items(cur);
      snapshot();
      if (b.dataset.act === "up" && i > 0) list.splice(i-1, 0, list.splice(i,1)[0]);
      if (b.dataset.act === "down" && i < list.length-1) list.splice(i+1, 0, list.splice(i,1)[0]);
      if (b.dataset.act === "dup") list.splice(i+1, 0, JSON.parse(JSON.stringify(list[i])));
      if (b.dataset.act === "del") list.splice(i, 1);
      sel = -1; buildCmds(); touched();
    };
  });
}
