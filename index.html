<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pokecrystal battle animation editor</title>
<style>
  :root{
    --bg:#14161a; --panel:#1b1e24; --panel2:#22262e; --line:#2e3440;
    --fg:#dfe4ec; --dim:#8b95a7; --accent:#8bc34a; --accent2:#5ab0e8;
    --warn:#e8b04b; --bad:#e8685a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  button,select,input{font:inherit;color:inherit}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 8px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--accent);color:#14161a;border-color:var(--accent);font-weight:700}
  button.sm{padding:1px 5px;font-size:11px}
  input,select{background:#12141a;border:1px solid var(--line);border-radius:4px;padding:2px 5px}
  input:focus,select:focus{outline:none;border-color:var(--accent2)}
  input[type=number]{width:58px}
  header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:13px;margin:0;font-weight:700;letter-spacing:.5px}
  header .spacer{flex:1}
  #status{color:var(--dim);font-size:11px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #main{display:flex;height:calc(100% - 41px)}
  #list{width:232px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
  #list .search{padding:6px}
  #list .search input{width:100%}
  #items{overflow-y:auto;flex:1}
  #items .row{padding:3px 9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #items .row:hover{background:var(--panel2)}
  #items .row.sel{background:#2c3a22;color:var(--accent)}
  #items .row .idx{color:var(--dim);font-size:11px;margin-right:6px}
  #items .row.dirty::after{content:" *";color:var(--warn)}
  #items .head{padding:6px 9px 2px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px;border-top:1px solid var(--line);margin-top:4px}
  #stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  #screenwrap{padding:12px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  #screen{image-rendering:pixelated;background:#e8f0d8;border:1px solid var(--line);border-radius:3px;cursor:crosshair}
  .ctrls{display:flex;flex-direction:column;gap:7px;min-width:220px}
  .ctrls .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ctrls label{color:var(--dim);font-size:11px}
  #timeline{margin:0 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel);cursor:pointer;width:calc(100% - 24px)}
  #cmdwrap{flex:1;overflow-y:auto;margin-top:8px;border-top:1px solid var(--line)}
  table.cmds{width:100%;border-collapse:collapse}
  table.cmds td{padding:2px 6px;border-bottom:1px solid #20242b;vertical-align:middle}
  table.cmds tr:hover{background:#1e222a}
  table.cmds tr.active{background:#2c3a22}
  table.cmds tr.sel td{box-shadow:inset 2px 0 0 var(--accent2)}
  td.t{color:var(--dim);width:42px;text-align:right;font-size:11px}
  td.c{color:var(--accent2);white-space:nowrap;width:160px}
  td.c.flow{color:var(--warn)}
  td.a{width:100%}
  td.b{white-space:nowrap;text-align:right}
  .lbl{color:var(--warn)}
  /* species picker: a real dropdown cannot be told where to scroll, so this
     stands in for one and opens with the selection on the top row */
  .picker{position:relative;display:inline-block}
  .picker>button{min-width:112px;text-align:left;padding-right:16px;position:relative}
  .picker>button::after{content:"";position:absolute;right:5px;top:50%;margin-top:-2px;
    border:3px solid transparent;border-top-color:var(--fg)}
  .picker .pop{position:absolute;z-index:60;left:0;top:calc(100% + 2px);min-width:100%;
    max-height:264px;overflow-y:auto;background:#12141a;border:1px solid var(--accent2);
    border-radius:4px;padding:1px}
  .picker .pop .opt{padding:1px 8px;white-space:nowrap;cursor:pointer;line-height:16px}
  .picker .pop .opt:hover{background:var(--panel2)}
  .picker .pop .opt.sel{background:var(--accent2);color:#14161a}
  .cmt{color:#6b7484;font-style:italic}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:4px;font-size:11px;color:var(--dim)}
  #raw{width:100%;height:100%;min-height:240px;background:#0f1116;color:var(--fg);border:0;padding:10px;resize:none;font:inherit}
  .tabs{display:flex;gap:4px;padding:6px 12px 0;align-items:center}
  .tabs button.on{border-color:var(--accent);color:var(--accent)}
  .hidden{display:none!important}
  #warn{color:var(--warn);font-size:11px;padding:0 12px 4px}
  #legend{color:var(--dim);font-size:11px}
  /* opening screen */
  #open{position:fixed;inset:0;background:#14161a;display:flex;align-items:center;justify-content:center;z-index:50}
  #open .card{max-width:620px;padding:26px 30px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  #open h2{margin:0 0 4px;font-size:16px}
  #open p{color:var(--dim);margin:8px 0}
  #open .btns{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
  #open code{background:#0f1116;padding:1px 5px;border-radius:3px;color:var(--accent)}
  #openlog{font-size:11px;color:var(--dim);white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:10px}
  #openerr{color:var(--bad);font-size:12px;white-space:pre-wrap}
  .ok{color:var(--accent)}
</style>
</head>
<body>

<div id="open">
  <div class="card">
    <h2>pokecrystal battle animation editor</h2>
    <p>Open your repo folder (the one containing <code>data/moves/animations.asm</code>).
       Everything runs in this page — no server, no upload.</p>
    <div class="btns">
      <button id="pick" class="primary">Open repo folder…</button>
      <button id="reopen" class="hidden">Reopen <span id="reopenname"></span></button>
      <button id="pickfallback">Choose folder (read-only)</button>
      <input id="dirinput" type="file" webkitdirectory directory multiple class="hidden">
    </div>
    <p id="fsnote"></p>
    <div id="openerr"></div>
    <div id="openlog"></div>
  </div>
</div>

<header>
  <h1>BATTLE ANIM EDITOR</h1>
  <span id="status">no repo open</span>
  <span class="spacer"></span>
  <button id="reload">Reload repo</button>
  <button id="download">Download .asm</button>
  <button id="save" class="primary">Save to repo</button>
</header>
<div id="main">
  <div id="list">
    <div class="search"><input id="filter" placeholder="filter moves / anims…"></div>
    <div id="items"></div>
  </div>
  <div id="stage">
    <div id="screenwrap">
      <canvas id="screen" width="480" height="432"></canvas>
      <div class="ctrls">
        <div class="line">
          <button id="play">▶ play</button>
          <button id="stepb" class="sm">◀</button>
          <button id="stepf" class="sm">▶</button>
          <button id="rew" class="sm">⟲</button>
          <span id="frameno" class="chip">f 0</span>
        </div>
        <div class="line">
          <label>side</label>
          <select id="turn"><option value="0">player attacks</option><option value="1">enemy attacks</option></select>
        </div>
        <div class="line">
          <label>param</label><input id="param" type="number" value="0" min="0" max="255">
          <label>rate</label>
          <select id="speed" title="script frames per second">
            <option value="1" selected>60 fps</option>
            <option value="0.25">15 fps</option>
            <option value="2">120 fps</option>
          </select>
        </div>
        <div class="line">
          <label><input type="checkbox" id="sound" checked> sound</label>
          <label><input type="checkbox" id="loopdelay" checked> 1s between loops</label>
        </div>
        <div class="line">
          <label><input type="checkbox" id="grid"> grid</label>
          <label><input type="checkbox" id="boxes"> pic boxes</label>
          <label><input type="checkbox" id="marks" checked> markers</label>
        </div>
        <div class="line">
          <label><input type="checkbox" id="gbctiming" checked title="drop a frame when an engine iteration overruns its vblank, as the hardware does">GBC timing</label>
          <label><input type="checkbox" id="hud" checked> hide attacker HUD</label>
          <label><input type="checkbox" id="textbox" checked title="keep the message box out of palette changes and scanline warps; it still scrolls with screen shakes">text box exempt</label>
        </div>
        <div class="line">
          <label><input type="checkbox" id="showBg" checked> screenshot</label>
          <button id="bgload" class="sm">load image…</button>
          <input id="bginput" type="file" accept="image/*" class="hidden">
        </div>
        <div class="line">
          <label><input type="checkbox" id="showTarget" checked> target pic</label>
          <label><input type="checkbox" id="showUser" checked> user pic</label>
        </div>
        <div class="line">
          <span class="lbl">opponent</span>
          <span class="picker sm" id="monEnemy"></span>
          <button id="cryEnemy" class="sm" title="play this species' cry">cry</button>
          <label><input type="checkbox" id="shinyEnemy"> shiny</label>
        </div>
        <div class="line">
          <span class="lbl">player</span>
          <span class="picker sm" id="monPlayer"></span>
          <button id="cryPlayer" class="sm" title="play this species' cry">cry</button>
          <label><input type="checkbox" id="shinyPlayer"> shiny</label>
        </div>
        <div class="line">
          <span class="lbl">music</span>
          <select id="music" class="sm"><option value="">off</option></select>
        </div>
        <div class="line">
          <span class="lbl">volume</span>
          <input type="range" id="volume" min="0" max="100" value="50" step="1">
          <span id="volval">50%</span>
        </div>
        <div id="legend"></div>
      </div>
    </div>
    <div id="warn"></div>
    <canvas id="timeline" height="46"></canvas>
    <div class="tabs">
      <button id="tab-cmd" class="on">commands</button>
      <button id="tab-raw">raw asm</button>
      <span style="flex:1"></span>
      <select id="addsel"></select>
      <button id="add" class="sm">+ insert</button>
      <button id="undo" class="sm">undo</button>
    </div>
    <div id="cmdwrap">
      <div id="cmdview"></div>
      <textarea id="raw" class="hidden" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<script>
"use strict";

/* ====================================================== battle scene assets

   Backdrop and the two mon pics, cut out of a real Sour Crystal screenshot
   (Hoothoot as the target pic, Squirtle as the user pic). The pics are
   separate layers so they can be moved wherever an animation needs them;
   "load image…" swaps in any other 160x144 screenshot as the backdrop.       */

const SCENE_ASSETS = {
  bg:     "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACQCAIAAAAA1/fXAAAFAklEQVR42u2dS3bjIBBFJR9NspUso7eVcbbVy8hWMlQPnFYwfwqwgbpvkBPLDiZcqihAovbzPDef9n233jKv7Pt+/8X9jHX9umLqPM/e5W9o27ZtOwR/Y5GI/+5997Xlq9Kthu5li5Hro5WPBXv8YSdB6MWAQ+NfK/UuH0lctOUbzbHQe3208rHgMgahcbGm9XuXr0rYARY8df9Vb/G5UfTLG8gNwZJVCs2hAfzboKFp6NOIWmMwLrexi37J1CXUmazKJHkTlBXMg59J2gvDnTTnOBXvojfz4FEiI5doaTnX+KJ2FSXWu18bZLnfXuqiWRJRMQ8G8KAWjF6z0FE6mI3WM7T1WmGQ9f318f31cf/lenldvK6j+Sw4orf3z4vr2/vnj8X8ZRNw2mmSZaZY7WoWbJqsabV32PeX55/BxuBNl0cpjqJXWjHQEGQdNApjMAIwAjAaGvAysZW2naVbUdOsM3lQg/lWFDAv1igaMO85t65p6OmrTv+4L5oxGAEYARgBGAEYARgBGMAIwAjACMAIwAjACMAARgBGAEYARgBGAEYARgAGMAIwGlqHwv85cpKSNy9TKL+T9+S90LHH+fmj3EqGagtgP13rkNVkjqaQLnLWJ70dQnBydZOHTrS76FC7L5OX6VBIVHaoqWwIqCm/STmHZqtNjrJtvUJlPXHRErPwWrYZ+9T46hH8PC7611BKGV8X3fQSOXFypM/FA/KyDs3zwSx0oBHHFCx4dE45LV+fNeag6bsSrcn7dB+8zZ8AHgVtfd4n78ILQdbQFpz/bkMXTZD1pLBIlvfp/C9xqIWL7jLVdi31Dun5KUFw0XM4A/mCNoDX1qHWJgT+drT659RNaZC1Rt6nnM5KkPWrGfM+JSfHqqdJa+R9itvxgcmaL03Ya+R9UhdFL3n8dQSixg1/VT2VpcrFfQZRdDEhdyVyi24qlCZNKCofC25D91r03x5vxXIvyujKygdwmzHbm5jTXVGyGGRu34rLx0U/w0WL1x8qy8eC29M1vajXqmT3uwvKZx7cPQZ2nar4aYbS8iM+HMDL9rwIRFz04gIwgNHMUjRNyrxTdcagTztgVRmhdQHWgDbxhMSyeXNJe8w8mCgaARgBGI0SRc8YmHjvf9AsK6g6zNaZOuCavf6d2mG3Dlyczghmr3/X1rDH4NlbBxfttsAhmDvPPvfXQ9cTRUN3sf+daRLzYARgBGAEYARgBGD0oJVv2fHeZRd5kiDnMc4tnE3nOha2aHYeenbhqnzlvYLr33SXzGuUSS5SoLfw0vxI3npGOg0uOmG1zftHzVeEekP9d2m5L9rKaiZoxFYP7CaNvu2+pxbANSevuxgio2bzCps7oYKa37TRFfxt113InJxcNRU4oOu2oxW4Woy7blh5XTQHghegzQmAc95KXmnbD8SMWegYrkeGOoqsxwB4cQEYwAjACMAIwAjAqFSk1SleLPSuDIt3CCLpv0P7zTkV1gs4TtTbiEmWlfs/paUVfR0uOm1h8TXI5z/VWLRseehk5gV2ocrflG2y0STYn86vIS5aDqxypzbSw/LtOPl5XPQDLVPWbW9uJwjtJzbxvTll5nyGE9+Lx7zQLmSTwdgspwlj8iYFr8fv8sm5IqtP2+/FRS8uAAMYzaxDPIMecEydsf69I4yH04fmPeBijcO+ezRF8H7/6fosZyh57fhWGeWPP/9R7qU5/m9x/QPIvMY9xV5fRQAAAABJRU5ErkJggg==",
};
// Pic positions are the game's own tile coordinates and are not adjustable:
// the enemy frontpic sits at tile (12,0) and the player backpic at (2,5).
// Only the visibility toggles are the user's to change, so only those are
// persisted — a saved scene from an older build that still carried
// coordinates would otherwise pin the pics wherever they were left.
const SCENE_COORDS = {tx:96, ty:0, ux:16, uy:40};
const SCENE_TOGGLES = {bg:true, target:true, user:true};
const SCENE_DEFAULT = {...SCENE_TOGGLES, ...SCENE_COORDS};
let scene = {...SCENE_DEFAULT};
const SCENE_KEY = "animeditor.scene";
let bgImg = null, bgSrc = null, targetImg = null, userImg = null;

function loadImg(src){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}
async function loadSceneAssets(){
  // only the backdrop is still a bundled image; both pics come from the repo
  bgImg = await loadImg(SCENE_ASSETS.bg);
  targetImg = userImg = null;
  bgSrc = bgImg;                         // keep the unlabelled original
  try {
    const saved = JSON.parse(localStorage.getItem(SCENE_KEY) || "null");
    if (saved)
      for (const k of Object.keys(SCENE_TOGGLES))
        if (typeof saved[k] === "boolean") scene[k] = saved[k];
  } catch {}
  Object.assign(scene, SCENE_COORDS);
}
function saveScene(){
  const keep = {};
  for (const k of Object.keys(SCENE_TOGGLES)) keep[k] = scene[k];
  try { localStorage.setItem(SCENE_KEY, JSON.stringify(keep)); } catch {}
}
function syncSceneInputs(){
  $("#showBg").checked = scene.bg;
  $("#showTarget").checked = scene.target;
  $("#showUser").checked = scene.user;
}
function monRects(){
  const out = [];
  if (scene.target && targetImg) out.push({k:"target", x:scene.tx, y:scene.ty,
    w:targetImg.width, h:targetImg.height});
  if (scene.user && userImg) out.push({k:"user", x:scene.ux, y:scene.uy,
    w:userImg.width, h:userImg.height});
  return out;
}

/* ============================================================ repo access */

const ANIM_FILE = "data/moves/animations.asm";

// Three ways to reach the files, same interface: text(), bytes(), has(), write().
function dirHandleRepo(root){
  const cache = new Map();
  async function fileFor(path){
    if (cache.has(path)) return cache.get(path);
    const parts = path.split("/");
    let d = root;
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
    const h = await d.getFileHandle(parts[parts.length-1]);
    cache.set(path, h);
    return h;
  }
  return {
    kind: "fs", name: root.name, writable: true, root,
    async has(path){ try { await fileFor(path); return true; } catch { return false; } },
    async bytes(path){ return new Uint8Array(await (await (await fileFor(path)).getFile()).arrayBuffer()); },
    async text(path){ return await (await (await fileFor(path)).getFile()).text(); },
    async write(path, text){
      const h = await fileFor(path);
      const w = await h.createWritable();
      await w.write(text);
      await w.close();
    },
  };
}

function fileListRepo(files){
  // <input webkitdirectory> - strip the chosen folder name from each path
  const map = new Map();
  let prefix = null;
  for (const f of files){
    const rel = f.webkitRelativePath || f.name;
    if (prefix === null) prefix = rel.split("/")[0] + "/";
    map.set(rel.startsWith(prefix) ? rel.slice(prefix.length) : rel, f);
  }
  return {
    kind: "files", name: (prefix||"").replace("/",""), writable: false,
    async has(p){ return map.has(p); },
    async bytes(p){ return new Uint8Array(await map.get(p).arrayBuffer()); },
    async text(p){ return await map.get(p).text(); },
    async write(){ throw new Error("read-only"); },
  };
}

function fetchRepo(base){
  return {
    kind: "http", name: base || "./", writable: false,
    async has(p){ try { const r = await fetch(base + p, {method:"HEAD"}); return r.ok; } catch { return false; } },
    async bytes(p){ const r = await fetch(base + p); if(!r.ok) throw new Error(p); return new Uint8Array(await r.arrayBuffer()); },
    async text(p){ const r = await fetch(base + p); if(!r.ok) throw new Error(p); return await r.text(); },
    async write(){ throw new Error("read-only"); },
  };
}

/* remember the last folder so reopening is one click */
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("anim-editor", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v){
  try { const db = await idb();
    await new Promise(res => { const t = db.transaction("kv","readwrite");
      t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; });
  } catch {}
}
async function idbGet(k){
  try { const db = await idb();
    return await new Promise(res => { const t = db.transaction("kv","readonly");
      const q = t.objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
  } catch { return null; }
}

/* ============================================================ asm parsing */

function stripComment(line){
  let out = "", com = null, inStr = false;
  for (let i = 0; i < line.length; i++){
    const ch = line[i];
    if (ch === '"') inStr = !inStr;
    if (ch === ";" && !inStr){ com = line.slice(i+1).trim(); break; }
    out += ch;
  }
  return [out.replace(/\s+$/, ""), com];
}

function splitArgs(s){
  const args = []; let depth = 0, cur = "";
  for (const ch of s || ""){
    if (ch === "(" || ch === "[") depth++;
    else if (ch === ")" || ch === "]") depth--;
    if (ch === "," && depth === 0){ if (cur.trim()) args.push(cur.trim()); cur = ""; }
    else cur += ch;
  }
  if (cur.trim()) args.push(cur.trim());
  return args;
}

let FIXED_Q = 8;                 // rgbasm -Q<n> fixed-point precision

function num(tok, consts){
  if (tok === undefined || tok === null) return 0;
  let t = String(tok).trim();
  if (consts && Object.prototype.hasOwnProperty.call(consts, t)) return consts[t];
  if (/^-?\d+\.\d+$/.test(t)) return Math.round(parseFloat(t) * (1 << FIXED_Q));
  if (/^\$[0-9a-fA-F]+$/.test(t)) return parseInt(t.slice(1), 16);
  if (/^%[01]+$/.test(t)) return parseInt(t.slice(1), 2);
  if (/^-?\d+$/.test(t)) return parseInt(t, 10);
  let expr = t;
  if (consts){
    expr = expr.replace(/[A-Za-z_]\w*/g, m =>
      Object.prototype.hasOwnProperty.call(consts, m) ? String(consts[m]) : m);
  }
  expr = expr.replace(/\$([0-9a-fA-F]+)/g, (_, h) => String(parseInt(h, 16)));
  if (/^[-+*/()|&<>~^ 0-9]+$/.test(expr)){
    try { return Function('"use strict";return (' + expr + ")")() | 0; } catch { return 0; }
  }
  return 0;
}

function parseConstants(texts){
  const consts = {};
  for (const text of texts){
    if (!text) continue;
    let value = 0, step = 1;
    for (const raw of text.split("\n")){
      const code = stripComment(raw)[0].trim();
      if (!code) continue;
      let m;
      if ((m = code.match(/^const_def\b(.*)/))){
        const a = splitArgs(m[1]);
        value = a.length ? num(a[0], consts) : 0;
        step = a.length > 1 ? num(a[1], consts) : 1;
        continue;
      }
      if ((m = code.match(/^const\s+(\w+)/))){
        consts[m[1]] = value; value += step; continue;
      }
      if ((m = code.match(/^const_skip\b\s*(.*)/))){
        value += step * (m[1].trim() ? num(m[1], consts) : 1); continue;
      }
      if ((m = code.match(/^const_next\s+(.+)/))){ value = num(m[1], consts); continue; }
      if ((m = code.match(/^(?:def\s+)?(\w+)\s+equs?\s+(.+)/i)) && !m[2].startsWith('"')){
        if (!(m[1] in consts)) consts[m[1]] = num(m[2], consts);
        continue;
      }
      if ((m = code.match(/^(?:def\s+)?(\w+)\s*=\s*(.+)/i))){ consts[m[1]] = num(m[2], consts); continue; }
    }
  }
  return consts;
}

function enumList(consts, prefix){
  const pairs = Object.entries(consts).filter(([k]) => k.startsWith(prefix)).map(([k,v]) => [v,k]);
  if (!pairs.length) return [];
  const out = new Array(Math.max(...pairs.map(p => p[0])) + 1).fill(null);
  pairs.sort((a,b) => a[0]-b[0]);
  for (const [v,k] of pairs) if (out[v] === null) out[v] = k;
  return out;
}

/* rgbasm allows $, # and @ inside a symbol, and Sour Crystal uses it:
   BattleAnimSub_BGCycleOBPalsGrayAndYellow_$2 is called from 34 animations.
   A \\w-only label pattern skipped the definition, so the block was never
   registered and every anim_call to it silently did nothing. */
const LABEL_CH = "[A-Za-z0-9_$#@]";
const LABEL_RE = new RegExp("^([A-Za-z_]" + LABEL_CH + "*):{1,2}\\s*$");
const LOCAL_RE = new RegExp("^\\.(" + LABEL_CH + "+):?$");
const CMD_RE = /^([A-Za-z_]\w*)\b\s*(.*)$/;

function parseAnimations(text){
  const lines = text.split("\n");
  const blocks = {}, order = [], table = [];
  let cur = null, idx = 0, inTable = false;

  for (let ln = 0; ln < lines.length; ln++){
    const raw = lines[ln];
    const [code, comment] = stripComment(raw);
    const s = code.trim();

    if (/^BattleAnimations::/.test(s)){ inTable = true; continue; }
    if (inTable){
      let m = s.match(/^dw\s+(\w+)/);
      if (m){ table.push({index: idx++, label: m[1], comment: comment || ""}); continue; }
      if (/^assert_table_length/.test(s)) continue;
      if (s && !/^table_width/.test(s)) inTable = false;
    }

    let m = code.match(LABEL_RE);
    if (m){
      const name = m[1];
      if (cur && cur.onlyLabels){
        cur.labels.push(name); cur.end = ln; blocks[name] = cur; order.push(name); continue;
      }
      cur = {labels:[name], start:ln, end:ln, items:[], onlyLabels:true, comment: comment || ""};
      blocks[name] = cur; order.push(name);
      continue;
    }
    if (!cur) continue;
    cur.end = ln;

    if (!s){
      cur.items.push(comment === null ? {t:"blank"} : {t:"comment", text:comment});
      continue;
    }
    if ((m = s.match(LOCAL_RE))){
      cur.items.push({t:"label", name:"." + m[1]}); cur.onlyLabels = false; continue;
    }
    if ((m = s.match(CMD_RE))){
      cur.items.push({t:"cmd", cmd:m[1], args:splitArgs(m[2]), comment: comment || ""});
      cur.onlyLabels = false; continue;
    }
    cur.items.push({t:"raw", text:raw}); cur.onlyLabels = false;
  }

  for (const b of Object.values(blocks)){
    while (b.items.length && b.items[b.items.length-1].t === "blank"){ b.items.pop(); b.end--; }
  }
  return {lines, blocks, order, table};
}

function serializeBlock(b){
  const out = b.labels.map((l, i) =>
    l + ":" + (i === 0 && b.comment ? " ; " + b.comment : ""));
  for (const it of b.items){
    if (it.t === "blank") out.push("");
    else if (it.t === "comment") out.push("; " + it.text);
    else if (it.t === "label") out.push(it.name);
    else if (it.t === "raw") out.push(it.text);
    else out.push("\t" + it.cmd + (it.args && it.args.length ? " " + it.args.join(", ") : "") +
      (it.comment ? " ; " + it.comment : ""));
  }
  return out;
}

function parseObjects(text, consts){
  const objs = [];
  for (const raw of text.split("\n")){
    const m = stripComment(raw)[0].match(/^\s*battleanimobj\s+(.*)/);
    if (!m) continue;
    const a = splitArgs(m[1]);
    objs.push({
      flags: num(a[0], consts), fixY: num(a[1], consts) & 0xff,
      frameset: num(a[2], consts), func: a[3], pal: a[4], gfx: a[5],
    });
  }
  return objs;
}

/* Framesets fall through into each other: .Frameset_IceBuildup runs its four
   frames and then continues straight into .Frameset_Frozen's flicker. So the
   entries are kept as one flat stream with each frameset recording where it
   starts, exactly like the pointer table does. */
function parseFramesets(text, consts){
  const order = [], entries = [], starts = {};
  let inTable = true;
  for (const raw of text.split("\n")){
    const s = stripComment(raw)[0].trim();
    if (!s) continue;
    let m = s.match(/^dw\s+\.(\w+)/);
    if (inTable && m){ order.push(m[1]); continue; }
    if ((m = s.match(/^\.(\w+):/))){
      inTable = false;
      if (starts[m[1]] === undefined) starts[m[1]] = entries.length;
      continue;
    }
    if (inTable) continue;
    if ((m = s.match(/^oamframe\s+(.*)/))){
      const a = splitArgs(m[1]), flags = a.slice(2).join(" ");
      entries.push({c:"frame", oamset:num(a[0], consts), dur:num(a[1], consts),
                    xflip:/X_?FLIP/.test(flags), yflip:/Y_?FLIP/.test(flags)});
      continue;
    }
    if ((m = s.match(/^oamwait\s+(.*)/))){
      entries.push({c:"wait", dur:num(m[1], consts)});
      continue;
    }
    if (/^oamdelete/.test(s)) entries.push({c:"delete"});
    else if (/^oamrestart/.test(s)) entries.push({c:"restart"});
    else if (/^oamend/.test(s)) entries.push({c:"end"});
  }
  return {
    sets: order.map(n => ({name:n, start: starts[n] !== undefined ? starts[n] : 0})),
    entries,
  };
}

function parseOam(text, consts){
  /* Same fallthrough trap as the framesets: a battleanimoam entry's length is
     just a count of dbsprites to read from its pointer onward, and two sets
     declare more than their own label holds, so the rest comes from whatever
     block follows.

       battleanimoam $05,  2, .OAMData_60   ; BATTLE_ANIM_OAMSET_60
       .OAMData_60:
           dbsprite  -1,  -1, 4, 0, $00, $0
       .OAMData_69:                          ; <- OAMSET_60's second sprite
           dbsprite  -1,   0, 4, 0, $00, $0

     Keeping a separate array per label dropped that sprite, which is why
     BATTLE_ANIM_OBJ_FOCUS drew half of its sparkle. So the dbsprites are one
     flat stream and each label only records where it starts; consecutive
     labels therefore alias the same body, as they do in the frameset parser. */
  const table = [], sprites = [], starts = {};
  for (const raw of text.split("\n")){
    const s = stripComment(raw)[0].trim();
    if (!s) continue;
    let m = s.match(/^battleanimoam\s+(.*)/);
    if (m){
      const a = splitArgs(m[1]);
      table.push({vtile:num(a[0], consts), len:num(a[1], consts), ptr:a[2].replace(/^\./,"")});
      continue;
    }
    if ((m = s.match(/^\.(\w+):/))){
      if (starts[m[1]] === undefined) starts[m[1]] = sprites.length;
      continue;
    }
    if ((m = s.match(/^dbsprite\s+(.*)/))){
      const a = splitArgs(m[1]);
      const xt = num(a[0], consts), yt = num(a[1], consts),
            xp = num(a[2], consts), yp = num(a[3], consts), attrs = a[5] || "";
      sprites.push({y:(yt*8 + yp) & 0xff, x:(xt*8 + xp) & 0xff, tile:num(a[4], consts),
                xflip:/X_?FLIP/.test(attrs), yflip:/Y_?FLIP/.test(attrs),
                pri:/PRIO(RITY)?/.test(attrs)});
    }
  }
  return table.map(t => {
    const at = starts[t.ptr];
    return {vtile:t.vtile,
            entries: at === undefined ? [] : sprites.slice(at, at + t.len)};
  });
}

function parseObjectGfx(tableText, incbinText, consts){
  const files = {};
  for (const raw of incbinText.split("\n")){
    const m = raw.trim().match(/^(\w+):\s*INCBIN\s+"([^"]+)"/);
    if (m) files[m[1]] = m[2];
  }
  const out = [];
  for (const raw of tableText.split("\n")){
    const m = stripComment(raw)[0].match(/^\s*anim_obj_gfx\s+(.*)/);
    if (!m) continue;
    const a = splitArgs(m[1]);
    out.push({count:num(a[0], consts), label:a[1].trim(), file: files[a[1].trim()] || ""});
  }
  return out;
}

async function parsePal(repo, path, seen){
  seen = seen || new Set();
  if (seen.has(path) || !(await repo.has(path))) return [];
  seen.add(path);
  const pals = []; let cur = [];
  for (const raw of (await repo.text(path)).split("\n")){
    const inc = raw.match(/^\s*INCLUDE\s+"([^"]+)"/);
    if (inc){ pals.push(...await parsePal(repo, inc[1], seen)); continue; }
    const m = stripComment(raw)[0].match(/^\s*RGB\s+(.*)/);
    if (m){
      const a = splitArgs(m[1]);
      cur.push([num(a[0])*8, num(a[1])*8, num(a[2])*8]);
      if (cur.length === 4){ pals.push(cur); cur = []; }
    }
  }
  return pals;
}

function parseMoveNames(text){
  const names = [];
  for (const raw of text.split("\n")){
    const m = raw.match(/^\s*li\s+"([^"]*)"/);
    if (m) names.push(m[1]);
  }
  return names;
}

/* ============================================================== graphics */

/* PNG -> RGBA, decoded here rather than through <canvas>. Going through the
   browser's decoder means colour management, premultiplied alpha and other
   per-browser behaviour can shift the exact palette indices these tiles need,
   so the bytes are unpacked directly: no interlacing (rgbgfx never writes it),
   colour types 0/2/3/4/6, bit depths 1/2/4/8/16. */
async function inflate(bytes){
  if (typeof DecompressionStream === "function"){
    const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  throw new Error("no DecompressionStream in this browser");
}

async function decodePNG(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (dv.getUint32(0) !== 0x89504e47) throw new Error("not a PNG");
  let pos = 8, w = 0, h = 0, depth = 0, ctype = 0, plte = null, trns = null;
  const idat = [];
  while (pos + 8 <= bytes.length){
    const len = dv.getUint32(pos);
    const typ = String.fromCharCode(bytes[pos+4], bytes[pos+5], bytes[pos+6], bytes[pos+7]);
    const body = bytes.subarray(pos + 8, pos + 8 + len);
    pos += 12 + len;
    if (typ === "IHDR"){
      const ih = new DataView(body.buffer, body.byteOffset, body.byteLength);
      w = ih.getUint32(0); h = ih.getUint32(4);
      depth = body[8]; ctype = body[9];
      if (body[12]) throw new Error("interlaced PNG");
    }
    else if (typ === "PLTE") plte = body;
    else if (typ === "tRNS") trns = body;
    else if (typ === "IDAT") idat.push(body);
    else if (typ === "IEND") break;
  }
  if (!w || !h) throw new Error("no IHDR");
  let all = idat[0];
  if (idat.length > 1){
    const total = idat.reduce((a, c) => a + c.length, 0);
    all = new Uint8Array(total);
    let at = 0;
    for (const c of idat){ all.set(c, at); at += c.length; }
  }
  const data = await inflate(all);

  const channels = {0:1, 2:3, 3:1, 4:2, 6:4}[ctype];
  if (!channels) throw new Error("colour type " + ctype);
  const bpp = Math.max(1, (channels * depth) >> 3);
  const stride = Math.ceil(w * channels * depth / 8);
  const rows = [];
  let prev = new Uint8Array(stride), at = 0;
  for (let y = 0; y < h; y++){
    const ft = data[at++];
    const line = data.slice(at, at + stride); at += stride;
    for (let i = 0; i < stride; i++){
      const a = i >= bpp ? line[i-bpp] : 0, bb = prev[i], c = i >= bpp ? prev[i-bpp] : 0;
      if (ft === 1) line[i] = (line[i] + a) & 0xff;
      else if (ft === 2) line[i] = (line[i] + bb) & 0xff;
      else if (ft === 3) line[i] = (line[i] + ((a + bb) >> 1)) & 0xff;
      else if (ft === 4){
        const pp = a + bb - c;
        const pa = Math.abs(pp-a), pb = Math.abs(pp-bb), pc = Math.abs(pp-c);
        line[i] = (line[i] + (pa <= pb && pa <= pc ? a : pb <= pc ? bb : c)) & 0xff;
      }
    }
    rows.push(line); prev = line;
  }

  const rgba = new Uint8ClampedArray(w * h * 4);
  const indices = ctype === 3 ? new Uint8Array(w * h) : null;
  const bits = (row, i) => {                 // sample channel i of a sub-byte pixel
    const per = 8 / depth;
    const byte = row[(i / per) | 0];
    return (byte >> (8 - depth * ((i % per) + 1))) & ((1 << depth) - 1);
  };
  for (let y = 0; y < h; y++){
    const row = rows[y];
    for (let x = 0; x < w; x++){
      let r, g, bl, al = 255;
      if (ctype === 3){
        const idx = depth === 8 ? row[x] : bits(row, x);
        indices[y*w + x] = idx;
        r = plte ? plte[idx*3] : 0; g = plte ? plte[idx*3+1] : 0; bl = plte ? plte[idx*3+2] : 0;
        if (trns && idx < trns.length) al = trns[idx];
      } else if (ctype === 0 || ctype === 4){
        let v;
        if (depth === 16) v = row[x * channels * 2];
        else if (depth === 8) v = row[x * channels];
        else v = bits(row, x * channels) * 255 / ((1 << depth) - 1);
        r = g = bl = v;
        if (ctype === 4) al = depth === 16 ? row[x*4+2] : row[x*channels+1];
      } else {
        const st = depth === 16 ? x * channels * 2 : x * channels;
        const sc = depth === 16 ? 2 : 1;
        r = row[st]; g = row[st+sc]; bl = row[st+sc*2];
        if (ctype === 6) al = row[st+sc*3];
      }
      const o = (y*w + x) * 4;
      rgba[o] = r; rgba[o+1] = g; rgba[o+2] = bl; rgba[o+3] = al;
    }
  }
  /* The indexed data and PLTE come back alongside the RGBA. A mon pic's
     palette *is* its PLTE, already in GB index order, so the index bitmap can
     be mapped straight through it - no need to rank colours by brightness,
     which is what mis-decoded noise.png into grey notes. */
  let pal = null;
  if (plte){
    pal = [];
    for (let i = 0; i + 2 < plte.length; i += 3)
      pal.push((plte[i] << 16) | (plte[i+1] << 8) | plte[i+2]);
  }
  return {w, h, rgba, pal, idx: indices};
}

async function loadImageRGBA(bytes){
  try {
    return await decodePNG(bytes);
  } catch (e){
    // fall back to the browser decoder if anything about the file is unusual
    const blob = new Blob([bytes], {type:"image/png"});
    const bmp = await createImageBitmap(blob);
    const c = document.createElement("canvas");
    c.width = bmp.width; c.height = bmp.height;
    const ctx = c.getContext("2d", {willReadFrequently:true});
    ctx.drawImage(bmp, 0, 0);
    const d = ctx.getImageData(0, 0, bmp.width, bmp.height);
    bmp.close && bmp.close();
    return {w:bmp.width, h:bmp.height, rgba:d.data, viaCanvas:true};
  }
}

// quantise to 4 GB colours, brightest first (matches rgbgfx index order)
function rgbaToTiles(w, h, rgba){
  const counts = new Map();
  const key = new Array(w*h);
  for (let i = 0, p = 0; i < w*h; i++, p += 4){
    const a = rgba[p+3];
    const k = a < 128 ? "t" : (rgba[p] << 16 | rgba[p+1] << 8 | rgba[p+2]);
    key[i] = k;
    counts.set(k, (counts.get(k)||0) + 1);
  }
  /* Colour indices come from the absolute GB shade, not the order the colours
     happen to appear in. rgbgfx maps white/light/dark/black to 0-3, so a file
     using only three of them - noise.png is white, dark grey and black - must
     yield 0, 2, 3. Ranking them 0, 1, 2 shifted every pixel one shade lighter,
     which is why Sing's notes came out grey instead of black. */
  const lumOf = v => ((v>>16&255)*299 + (v>>8&255)*587 + (v&255)*114) / 1000;
  const shadeOf = (v) => {
    const l = lumOf(v);
    return l > 212 ? 0 : l > 128 ? 1 : l > 43 ? 2 : 3;
  };
  const colors = [...counts.keys()].filter(k => k !== "t");
  colors.sort((a,b) => lumOf(b) - lumOf(a));
  let index = new Map(colors.map(c => [c, shadeOf(c)]));
  if (new Set(index.values()).size !== colors.length)      // two on one shade
    index = new Map(colors.map((c,i) => [c, Math.min(i,3)]));
  index.set("t", 0);
  const tiles = [];
  for (let ty = 0; ty < (h>>3); ty++)
    for (let tx = 0; tx < (w>>3); tx++){
      const t = new Uint8Array(64);
      for (let y = 0; y < 8; y++)
        for (let x = 0; x < 8; x++)
          t[y*8+x] = index.get(key[(ty*8+y)*w + tx*8+x]) || 0;
      tiles.push(t);
    }
  return tiles;
}

function tilesFrom2bpp(bytes){
  const tiles = [];
  for (let i = 0; i + 16 <= bytes.length; i += 16){
    const t = new Uint8Array(64);
    for (let y = 0; y < 8; y++){
      const lo = bytes[i+y*2], hi = bytes[i+y*2+1];
      for (let x = 0; x < 8; x++){
        const bit = 7-x;
        t[y*8+x] = ((lo >> bit) & 1) | (((hi >> bit) & 1) << 1);
      }
    }
    tiles.push(t);
  }
  return tiles;
}

const FLIPBITS = (() => {
  const f = new Uint8Array(256);
  for (let i = 0; i < 256; i++){
    let v = 0;
    for (let b = 0; b < 8; b++) v |= ((i >> b) & 1) << (7-b);
    f[i] = v;
  }
  return f;
})();

function tileTo2bpp(t){
  const out = new Uint8Array(16);
  for (let y = 0; y < 8; y++){
    let lo = 0, hi = 0;
    for (let x = 0; x < 8; x++){
      const c = t[y*8+x], bit = 7-x;
      lo |= (c & 1) << bit; hi |= ((c >> 1) & 1) << bit;
    }
    out[y*2] = lo; out[y*2+1] = hi;
  }
  return out;
}

// reimplementation of tools/gfx for the options the Makefile uses on anim gfx
function gfxTransform(tiles, flags){
  let data = tiles.map(tileTo2bpp);
  const isWS = t => t.every(b => b === 0);
  const eq = (a,b) => { for (let i = 0; i < 16; i++) if (a[i] !== b[i]) return false; return true; };
  const flip = (t, xf, yf) => {
    const out = new Uint8Array(16);
    for (let i = 0; i < 16; i++){
      const j = yf ? 15 - (i ^ 1) : i;
      out[j] = xf ? FLIPBITS[t[i]] : t[i];
    }
    return out;
  };
  const keepWS = flags.includes("--keep-whitespace");
  const dedupe = (xf, yf, exact) => {
    const kept = [];
    for (const t of data){
      if (keepWS && isWS(t)){ kept.push(t); continue; }
      const probe = exact ? t : flip(t, xf, yf);
      if (!kept.some(k => eq(k, probe))) kept.push(t);
    }
    return kept;
  };
  if (flags.includes("--trim-whitespace")) while (data.length && isWS(data[data.length-1])) data.pop();
  if (flags.includes("--remove-duplicates")) data = dedupe(false, false, true);
  if (flags.includes("--remove-xflip")) data = dedupe(true, false, false);
  if (flags.includes("--remove-yflip")) data = dedupe(false, true, false);
  if (flags.includes("--remove-xflip") && flags.includes("--remove-yflip")) data = dedupe(true, true, false);
  if (flags.includes("--remove-whitespace")) data = data.filter(t => !isWS(t));
  return data.map(tilesFrom2bppSingle);
}
function tilesFrom2bppSingle(b){ return tilesFrom2bpp(b)[0]; }

async function loadGfx(repo, gfxTable, makefile, log){
  const processed = {};
  for (const raw of (makefile || "").split("\n")){
    const m = raw.match(/gfx\/battle_anims\/([\w.]+)\.2bpp:\s*tools\/gfx\s*\+=\s*(.*)/);
    if (m) processed[m[1]] = m[2].trim().split(/\s+/);
  }
  const warnings = [];
  for (const g of gfxTable){
    const base = (g.file || "").replace(/\.(2bpp|1bpp)(\.lz)?$/, "");
    const name = base.split("/").pop();
    g.src = base; g.tiles = []; g.origin = "none";
    if (!base) continue;
    try {
      if (await repo.has(base + ".2bpp")){
        g.tiles = tilesFrom2bpp(await repo.bytes(base + ".2bpp"));
        g.origin = "2bpp";
      } else if (await repo.has(base + ".png")){
        const img = await loadImageRGBA(await repo.bytes(base + ".png"));
        let tiles = rgbaToTiles(img.w, img.h, img.rgba);
        g.origin = "png";
        if (processed[name]){ tiles = gfxTransform(tiles, processed[name]); g.origin = "png+gfx"; }
        g.tiles = tiles;
      }
    } catch (e){ g.origin = "error"; g.err = e.message; }
    if (g.err) warnings.push(`${name}: ${g.err}`);
    else if (g.count && !g.tiles.length)
      warnings.push(`${name}: no tiles decoded (looked for ${base}.2bpp / .png)`);
    else if (g.count && g.tiles.length !== g.count && g.origin.startsWith("png"))
      warnings.push(`${name} (${g.tiles.length} tiles, table says ${g.count})`);
  }
  return warnings;
}

/* The substitute doll and the minimize pic are plain graphics rather than
   battle-anim object sets, so they miss loadGfx's table entirely. Same
   decode though: prefer a built .2bpp, fall back to the PNG. */
async function loadSwapTiles(repo, file){
  if (!file) return [];
  try {
    if (/\.2bpp$/.test(file)) return tilesFrom2bpp(await repo.bytes(file));
    const img = await loadImageRGBA(await repo.bytes(file));
    return rgbaToTiles(img.w, img.h, img.rgba);
  } catch (e){ return []; }
}

/* The species picker. A native select popup scrolls only far enough to bring
   the selection into view, which leaves it on the bottom row with the rest of
   the dex out of sight, and that scroll offset is not scriptable. Rotating the
   list put Bulbasaur under Celebi, so this is a plain listbox instead: dex
   order throughout, opened with the selection scrolled to the top row. */
let openPicker = null;
function closePicker(){
  if (!openPicker) return;
  openPicker.remove();
  openPicker = null;
}
document.addEventListener("mousedown", e => {

function fillMonSelect(host, side, onPick){
  if (!host || !MON_LIST.length) return;
  host.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "sm";
  btn.textContent = MON_LIST[monPick[side]].name;
  host.appendChild(btn);

  btn.onclick = () => {
    if (openPicker && openPicker.parentElement === host){ closePicker(); return; }
    closePicker();
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML = MON_LIST.map((m, i) =>
      `<div class="opt${i === monPick[side] ? " sel" : ""}" data-i="${i}">${m.name}</div>`).join("");
    host.appendChild(pop);
    openPicker = pop;
    // put the selection on the top row; clamped by the list's own scroll range
    const row = pop.firstChild;
    pop.scrollTop = monPick[side] * (row ? row.offsetHeight : 16);
    pop.onclick = async ev => {
      const opt = ev.target.closest(".opt");
      if (!opt) return;
      const i = +opt.dataset.i;
      closePicker();
      btn.focus();                      // keep the arrow keys working after
      if (i === monPick[side]) return;
      monPick[side] = i;
      btn.textContent = MON_LIST[i].name;
      await onPick();
    };
  };

  /* Once the button has focus the arrows step through the dex without having
     to open the list, which is the quick way to flick between neighbouring
     species. The event is stopped here because the same keys nudge a selected
     anim_obj's coordinates. Reloading a pic is async, so the reload is
     coalesced - holding an arrow down would otherwise queue one per repeat. */
  btn.onkeydown = ev => {
    if (ev.key === "Enter" || ev.key === " "){
      ev.preventDefault(); ev.stopPropagation(); btn.onclick(); return;
    }
    const d = ev.key === "ArrowDown" ? 1 : ev.key === "ArrowUp" ? -1 : 0;
    if (!d) return;
    ev.preventDefault();
    ev.stopPropagation();
    const next = Math.max(0, Math.min(MON_LIST.length - 1, monPick[side] + d));
    if (next === monPick[side]) return;
    monPick[side] = next;
    btn.textContent = MON_LIST[next].name;
    if (openPicker && openPicker.parentElement === host){
      const opts = openPicker.querySelectorAll(".opt");
      opts.forEach((o, i) => o.classList.toggle("sel", i === next));
      const h = opts[0] ? opts[0].offsetHeight : 16;
      const top = openPicker.scrollTop, view = openPicker.clientHeight;
      if (next * h < top) openPicker.scrollTop = next * h;
      else if ((next + 1) * h > top + view) openPicker.scrollTop = (next + 1) * h - view;
    }
    clearTimeout(btn._pickTimer);
    btn._pickTimer = setTimeout(onPick, 90);
  };
}

function buildMonPickers(){
  const fill = (id, side) => {
    const el = $("#" + id);
    if (!el) return;
    if (!MON_LIST.length){ el.textContent = "(no species)"; return; }
    fillMonSelect(el, side, async () => { await loadMonPics(); render(); });
  };
  fill("monEnemy", 0);
  fill("monPlayer", 1);
  const mus = $("#music");
  if (mus){
    mus.innerHTML = '<option value="">off</option>' + MUSIC_LIST.map(m =>
      `<option value="${m.label}">${m.name}</option>`).join("");
    mus.value = musicPick;                 // off by default
    mus.onchange = async () => {
      musicPick = mus.value;
      if (musicPick && $("#sound").checked) await playMusic(musicPick);
      else stopMusic();
    };
  }
  for (const [id, side] of [["cryEnemy", 0], ["cryPlayer", 1]]){
    const el = $("#" + id);
    if (!el) continue;
    el.disabled = !MON_CRIES.length;
    el.onclick = () => { audioCtx(); playCry(monPick[side]); };
  }
  for (const [id, side] of [["shinyEnemy", 0], ["shinyPlayer", 1]]){
    const el = $("#" + id);
    if (!el) continue;
    el.checked = !!monShiny[side];
    el.onchange = () => {
      monShiny[side] = el.checked;
      swapPicCache.clear(); transformPicCache.clear();     // the other slot's transform pic uses it too
      render();
    };
  }
}

async function pickPath(repo, list){
  for (const p of list) if (await repo.has(p)) return p;
  return null;
}

/* InitBattleAnimBuffer's enemy-side fix: x = <mirror> - x and, for fixY $ff,
   y = y + <yAdd>. Both are read back out of the engine so a fork that
   retunes them stays accurate. */
function parseCoordFix(text, consts){
  const out = {mirrorX: 180, yAdd: 40};
  if (!text) return out;
  const lines = text.split("\n").map(l => stripComment(l)[0].trim());
  const lookBack = (i) => {
    for (let j = i - 1; j >= 0 && i - j < 6; j--){
      const m = lines[j].match(/^ld a, (.+)$/);
      if (m) return num(m[1], consts) & 0xff;
    }
    return null;
  };
  for (let i = 0; i < lines.length; i++){
    if (/^sub d$/.test(lines[i]) && /wBattleAnimTempXCoord/.test(lines[i+1] || "")){
      const v = lookBack(i);
      if (v !== null) out.mirrorX = v;
    }
    if (/^add d$/.test(lines[i])){
      const v = lookBack(i);
      if (v !== null && v > 0 && v < 128) out.yAdd = v;
    }
  }
  return out;
}

  const title = s => s.toLowerCase().replace(/(^|[\s\-])(\w)/g, (m,a,b) => a + b.toUpperCase());

  D = {

/* ==========================================================================
   Battle anim object functions, ported from engine/battle_anims/functions.asm

   Each entry runs one frame for one object, mirroring DoBattleAnimFrame. The
   object struct fields are 8-bit, so every write goes through b() to wrap the
   way the hardware does - several animations depend on that wraparound.
   Functions return true for "carry set" where the asm uses carry as a result.
   ========================================================================== */

/* The index -> function mapping is read out of the repo's own jumptable in
   engine/battle_anims/functions.asm, so forks that add, remove or reorder
   functions still line up. Names below are the asm labels with the
   BattleAnimFunc_ / BattleAnimFunction_ prefix stripped. A name with no
   implementation here simply gets no movement, and the UI says so. */
let ANIM_FUNC_ORDER = [];

function parseAnimFuncTable(text){
  const out = [];
  const lines = text.split("\n");
  let i = lines.findIndex(l => /^\.Jumptable:/.test(l.trim()));
  if (i < 0) i = lines.findIndex(l => /DoBattleAnimFrame/.test(l));
  if (i < 0) return out;
  for (let j = i; j < lines.length; j++){
    const s = stripComment(lines[j])[0].trim();
    if (!s || /^table_width/.test(s)) continue;
    const m = s.match(/^dw\s+([A-Za-z_]\w*)/);
    if (m){
      out.push(m[1].replace(/^BattleAnimFunc(tion)?_/, ""));
      continue;
    }
    if (/^assert_table_length/.test(s)) break;
    if (out.length) break;                      // table finished
  }
  return out;
}

/* ----------------------------------------------------------- byte helpers */
const b = v => v & 0xff;
const s8 = v => ((v & 0xff) ^ 0x80) - 0x80;
const sra = v => b(s8(v) >> 1);              // arithmetic shift right
const sraN = (v, n) => { let x = v; for (let i = 0; i < n; i++) x = sra(x); return x; };

/* sine_table 32: dw sin(x * 0.5/32) in rgbasm fixed point, so each entry is
   sin scaled by 1 << Q (with the usual -Q8, the peak is exactly $100). The
   scale is read from the repo's Makefile, since it changes the amplitudes. */
let SINE_WAVE = new Uint16Array(32);
function buildSineWave(q){
  SINE_WAVE = new Uint16Array(32);
  for (let i = 0; i < 32; i++)
    SINE_WAVE[i] = Math.round((1 << q) * Math.sin(i * Math.PI / 32)) & 0xffff;
}
buildSineWave(8);

function animSine(a, d){                     // a = d * sin(a * pi/32)
  a = a & 0x3f;
  const neg = a >= 0x20;
  if (neg) a &= 0x1f;
  const hl = (b(d) * SINE_WAVE[a]) & 0xffff;
  const r = (hl >> 8) & 0xff;
  return neg ? b(-r) : r;
}
const animCos = (a, d) => animSine(b(a + 0x10), d);

/* ------------------------------------------------------- struct shorthands */
const NOP = () => {};
const DEL = o => { o.dead = true; };         // DeinitBattleAnimation
const inc = o => { o.jti = b(o.jti + 1); };  // BattleAnim_IncAnonJumptableIndex
function JT(o, S, table){                    // BattleAnim_AnonJumptable
  const h = table[o.jti];
  return h ? h(o, S) : undefined;
}
function reframe(o, frameset){                // ReinitBattleAnimFrameset
  o.framesetId = frameset;
  o.duration = 0;
  o.frameIdx = -1;
}

// BattleAnim_StepToTarget: step toward the far side, y rising half as fast
function stepToTarget(o, a){
  const e = a & 0xf;
  o.x = b(o.x + e);
  const n = (e >> 1) === 0 ? 256 : (e >> 1);   // dec-until-zero wraps when 0
  o.y = b(o.y - n);
}
// BattleAnim_StepCircle: circular path, height 1/4 of width
function stepCircle(o, a, d){
  o.yoff = sraN(animSine(a, d), 2);
  o.xoff = animCos(a, d);
}
/* Radial movers (RadialMoveOut): var1/var2 hold an 8.8 distance from the
   centre, param is the angle. Rad_Move deletes the object once the whole-pixel
   part of the distance passes the step's limit, and otherwise places it with
   the *previous* distance as the amplitude, as the asm leaves d holding it. */
function radStep(o, speed, limit){
  const oldHi = o.var1;
  const pos = ((o.var1 << 8) | o.var2) + speed;
  o.var1 = (pos >> 8) & 0xff;
  o.var2 = pos & 0xff;
  if (o.var1 >= limit){ DEL(o); return; }
  o.yoff = animSine(o.param, oldHi);
  o.xoff = animCos(o.param, oldHi);
}

const AF = {};

/* ==========================================================================
   Background effects, ported from engine/battle_anims/bg_effects.asm

   Each effect is a small state machine over the same struct the game uses
   (function, jumptable index, battle turn, param) and writes into a screen
   state the renderer reads: DMG palette maps for BG / OBJ0 / OBJ1, hSCX and
   hSCY scroll, and per-mon offsets, visibility and brightness. The scanline
   (LY override) effects move whole mon pics here, which is what they look
   like on hardware.
   ========================================================================== */

let BG_EFFECT_ORDER = [];                 // index -> name, read from the repo
// wActiveBGEffects holds this many structs. A fork that resizes it changes
// which effects get dropped when the script queues faster than they retire,
// so it is read from the repo's own constants; 5 is vanilla.
let NUM_BG_EFFECTS = 5;

/* BattleBGEffect_Water differs between repos: base pokecrystal grows the wave
   band two lines per frame (inc [hl] twice), Sour Crystal one. The phase step,
   the frame limit and the growth rate are read out of the effect's own body so
   either is reproduced exactly. */
let BG_WATER = {growth: 1, phaseStep: 4, limit: 0x20};

/* BattleAnimFunc_WaterGun's turn-down height differs too: base pokecrystal
   drops the stream at y $30, Sour Crystal at $2c. Read it from the function's
   own body rather than baking either in. */
let FUNC_WATERGUN_Y = 0x30;

/* A handful of object functions were retuned in forks, so their constants are
   read from the repo's own body rather than baked in. */
let FUNC_TUNE = {};

function funcBody(text, name){
  const lines = text.split("\n");
  const at = lines.findIndex(l => new RegExp("^BattleAnimFunc(tion)?_" + name + ":").test(l));
  if (at < 0) return [];
  const out = [];
  for (let i = at + 1; i < lines.length; i++){
    if (/^BattleAnimFunc(tion)?_\w+:/.test(lines[i])) break;
    out.push(stripComment(lines[i])[0].trim());
  }
  return out;
}

function parseFuncTuning(text){
  const t = {};
  const body = n => funcBody(text, n);

  // FireBlast: base drops the flame at $88 with 1px steps and uses the BURNED
  // frameset; Sour Crystal uses $84, 2px steps and FIRE_BLAST_IMPACT
  const fb = body("FireBlast");
  const fbCp = fb.find(l => /^cp \$8[0-9a-f]$/.test(l));
  t.fireBlastX = fbCp ? num("$" + fbCp.slice(4)) : 0x88;
  let step = 1;
  for (let i = 1; i < fb.length; i++)
    if (/^(dec|inc) \[hl\]$/.test(fb[i]) && fb[i] === fb[i-1]) step = 2;
  t.fireBlastStep = step;
  const fbFs = fb.find(l => /^ld a, BATTLE_ANIM_FRAMESET_\w+$/.test(l));
  t.fireBlastFrameset = fbFs ? fbFs.replace("ld a, ", "") : "BATTLE_ANIM_FRAMESET_BURNED";

  // PetalDance: sink limit and step
  const pd = body("PetalDance");
  const pdCp = pd.find(l => /^cp \$[0-9a-f]+$/.test(l));
  t.petalLimit = pdCp ? num("$" + pdCp.slice(4)) : 0x28;
  t.petalStep = pd.filter(l => l === "inc [hl]").length >= 3 ? 2 : 1;

  // Bubble: the param-selected fast speed only exists in some repos
  t.bubbleFast = body("Bubble").some(l => /^ld de, \$88$/.test(l));

  // Drop: the sideways drift through VAR3/VAR4
  t.dropDrift = body("Drop").some(l => /VAR3/.test(l));

  // SkyAttack cycles wOBP0 through .GBCPals. The preview models a CGB, so the
  // SGB table beside it is ignored, as it is for the OB cyclers.
  const sa = body("SkyAttack");
  const saAt = sa.findIndex(l => /^\.GBCPals:?$/.test(l));
  if (saAt >= 0){
    const d = sa[saAt + 1] || "";
    if (d.startsWith("db ")){
      const vals = splitArgs(d.slice(3)).map(v => num(v) & 0xff);
      if (vals.length === 4) t.skyAttackPals = vals;
    }
  }

  return t;
}

function parseWaterGunY(text){
  if (!text) return 0x30;
  const lines = text.split("\n").map(l => stripComment(l)[0].trim());
  const at = lines.findIndex(l => /^BattleAnimFunc_WaterGun:/.test(l));
  if (at < 0) return 0x30;
  for (let i = at + 1; i < lines.length && i < at + 40; i++){
    if (/^BattleAnimFunc_/.test(lines[i])) break;
    const m = lines[i].match(/^cp \$([0-9a-f]+)$/i);
    if (m) return num("$" + m[1]);
  }
  return 0x30;
}

/* The fade/flash effects are palette animations: hLCDCPointer points at rBGP
   and the LY override buffer holds a palette byte per scanline, so only the
   mon's rows change palette. Each effect carries its own list, $ff ending it
   and $fe looping, so the lists are read out of the repo. */
let BG_PAL_LISTS = {};

/* BattleBGEffect_RunPicResizeScript drives EnterMon and ReturnMon. Its three
   tables are all read out of the repo rather than baked in:

     .Coords      the tile coordinate each step draws at
     .BGSquares   dn w, h plus a pointer to that size's tile table
     .SixBySix &c which tile of the full pic lands in each cell

   A square smaller than the pic is not a scaled copy - it is a *subsample*.
   FourByFour keeps tile columns and rows 0, 2, 3 and 5 of the 6x6 pic and
   throws away 1 and 4, so the pic loses two bands in each axis. The tile
   index is column-major over the full pic, so the base dimension is
   sqrt(max index + 1): 36 -> 6 for the player's squares, 49 -> 7 for the
   enemy's. Each step's entry is `db square, baseTile, coord`, with -1 ending
   the script, -2 clearing a box and -3 pausing without drawing. */
let BG_PIC_RESIZE = {coords: [], squares: [], scripts: {}};

/* BattleAnimCmd_RaiseSub and GetMinimizePic build a replacement pic in
   sScratch: blank the whole thing, then drop a few tiles in. Both the
   destination slots and the pic's own dimension come out of the same
   expression, since `sScratch + (2 * 7 + 5) tiles` is column-major over a
   7-wide pic - so the middle number is the base dimension, the first is the
   column and the last the row. RaiseSub copies four tiles of
   MonsterSpriteGFX (the doll is 2x2); the minimize pic is a single tile.

   The two are staged differently, which decides *when* the swap shows.
   RaiseSub requests straight into vTiles2, the pic the background draws from,
   so the doll appears at once. anim_minimize writes to vTiles0 tile $00, which
   is only the staging buffer - the tiny pic does not appear until
   anim_updateactorpic copies vTiles0 over vTiles2. anim_minimizeopp skips the
   staging and hits vTiles2 directly. */
let PIC_SWAPS = {sub: {}, minimize: {}};

/* ------------------------------------------------- mon pics and palettes --
   The preview used to draw two screenshots, which meant Transform had no
   second pic to swap in and neither side could be changed. Everything now
   comes out of the repo instead.

   data/pokemon/palettes.asm is the species list: one INCBIN of a folder's
   normal.gbcpal plus an INCLUDE of its shiny.pal per species, in dex order,
   after a literal entry for index 000. The folder name in those paths is the
   only reliable species -> directory mapping, since the sanitised names
   (farfetch_d, nidoran_f, mr__mime) are not derivable from the display names.

   The normal palette is not a checked-in file: the Makefile generates
   normal.gbcpal *from the png*, so the png's own PLTE is the palette, and its
   four entries are already in GB index order. A handful of species pass
   --reverse to tools/gbcpal, which swaps the two middle colours - the two
   repos disagree on that list, so it is read from the Makefile. */
let MON_LIST = [];                     // [{folder, name, shinyFile, reverse}]

function parseMonList(palText, nameText, makeText){
  const out = [];
  if (!palText) return out;
  const folders = [];
  for (const raw of palText.split("\n")){
    const m = stripComment(raw)[0].match(/INCBIN\s+"gfx\/pokemon\/([^/"]+)\/normal\.gbcpal"/);
    if (m) folders.push(m[1]);
  }
  // dname "BULBASAUR" lines, in the same dex order
  const names = [];
  for (const raw of (nameText || "").split("\n")){
    const m = raw.match(/^\s*dname\s+"([^"]*)"/);
    if (m) names.push(m[1].replace(/@+$/, "").trim());
  }
  const reverse = new Set();
  for (const raw of (makeText || "").split("\n")){
    const m = raw.match(/^gfx\/pokemon\/([^/]+)\/normal\.gbcpal:\s*tools\/gbcpal\s*\+=\s*--reverse/);
    if (m) reverse.add(m[1]);
  }
  folders.forEach((folder, i) => out.push({
    folder,
    name: names[i] || folder.toUpperCase(),
    shinyFile: "gfx/pokemon/" + folder + "/shiny.pal",
    reverse: reverse.has(folder),
  }));
  return out;
}

// shiny.pal holds the two middle colours as `RGB r, g, b` in 5-bit components
function parseShinyPal(text){
  const out = [];
  for (const raw of (text || "").split("\n")){
    const m = stripComment(raw)[0].match(/^\s*RGB\s+(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (m) out.push(gbcColour(+m[1], +m[2], +m[3]));
  }
  return out.length >= 2 ? out.slice(0, 2) : null;
}
// 5 bits per component, the same expansion the hardware's colour curve implies
const gbcColour = (r, g, b) =>
  (Math.round(r * 255 / 31) << 16) | (Math.round(g * 255 / 31) << 8) | Math.round(b * 255 / 31);

/* A frontpic png is the whole animation strip - width is the pic's size in
   pixels and the height a multiple of it - so frame 0 is the first `w` rows.
   Backpics are always 6x6. PadFrontpic fits a pic into the enemy's 7x7 box by
   filling one blank column at the left, then (7 - size) blank tiles at the top
   of each column, and for a 5-wide pic one more blank column at the right. So
   the pic sits bottom-aligned, one tile in from the left, which is why small
   mons stand on the same ground line as big ones. */
function frontPicOffset(size){
  return {x: size === 7 ? 0 : 8, y: (7 - size) * 8};
}

let monShiny = [false, false];         // per side: shiny palette?
const monPicStore = [null, null];      // per side: {idx, w, h, size, pal, shinyPal}
const monPicCanvas = new Map();        // "side:shiny:byte" -> canvas

/* tools/gbcpal turns a pic's png palette into the two middle colours the game
   stores. It does not keep the png's order: it sorts the four entries by
   luminance - lightest first, or darkest first with --reverse - drops pure
   black, pure white and adjacent duplicates, and writes
   [WHITE, colors[0], colors[1], BLACK].

   The png palettes are authored to already match, so for an ordinary species
   the sort is a no-op, and for the eight that pass --reverse (Spearow,
   Fearow, Farfetch'd, Hitmonlee, Scyther, Jynx, Porygon, Porygon2) the middle
   pair is authored darkest-first and the reversed sort is likewise a no-op.
   Simply swapping the middle pair for those species - which is what --reverse
   looks like it means - inverted exactly those eight. */
const GBC_WHITE = 0xffffff, GBC_BLACK = 0x000000;
function gbcPalette(plte, reverse){
  const lum = c => 0.299 * ((c >> 16) & 0xff) + 0.587 * ((c >> 8) & 0xff)
                 + 0.114 * (c & 0xff);
  const sorted = plte.slice().sort((a, b) => reverse ? lum(a) - lum(b) : lum(b) - lum(a));
  const mid = [];
  for (const c of sorted){
    if (c === GBC_WHITE || c === GBC_BLACK) continue;
    if (mid.length && mid[mid.length - 1] === c) continue;
    mid.push(c);
  }
  return [GBC_WHITE,
          mid.length > 0 ? mid[0] : GBC_WHITE,
          mid.length > 1 ? mid[1] : (mid.length > 0 ? mid[0] : GBC_BLACK),
          GBC_BLACK];
}

/* A pic png must be a 4-colour indexed image: gbcpal reads its palette chunk,
   and rgbgfx rejects anything else at build time. The loader holds to that
   rather than guessing a palette out of the pixels, so a sprite that has lost
   its palette chunk - which is what re-saving from most image editors does -
   fails here and is reported by checkMonPics below instead of quietly
   rendering in colours the ROM would never show. */
function picPalette(img, w, reverse){
  if (!img.idx || !img.pal || img.pal.length !== 4) return null;
  const pal = gbcPalette(img.pal.slice(0, 4), reverse);
  const idx = new Uint8Array(w * w);
  idx.set(img.idx.subarray(0, w * w));              // frame 0 only
  return {idx, pal};
}

/* Chunk-walk a png for just its colour type and palette size. No inflate, so
   the whole dex can be checked at load time without decoding 500 images. */
function pngInfo(bytes){
  if (bytes.length < 8) return null;
  let pos = 8, ctype = -1, plte = 0, w = 0, h = 0;
  const u32 = o => (bytes[o] << 24 | bytes[o+1] << 16 | bytes[o+2] << 8 | bytes[o+3]) >>> 0;
  while (pos + 8 <= bytes.length){
    const len = u32(pos);
    const typ = String.fromCharCode(bytes[pos+4], bytes[pos+5], bytes[pos+6], bytes[pos+7]);
    const body = pos + 8;
    if (typ === "IHDR"){ w = u32(body); h = u32(body + 4); ctype = bytes[body + 9]; }
    else if (typ === "PLTE") plte = len / 3;
    else if (typ === "IDAT" || typ === "IEND") break;
    pos = body + len + 4;
  }
  return {w, h, ctype, plte};
}

// name every pic that is not a 4-colour indexed png, so they can be fixed
async function checkMonPics(repo, list){
  const bad = [];
  for (const e of list){
    for (const which of ["front", "back"]){
      for (const dir of [e.folder, e.folder + "_s"]){
        let info = null;
        try { info = pngInfo(await repo.bytes("gfx/pokemon/" + dir + "/" + which + ".png")); }
        catch (err){ continue; }                     // not this folder
        if (!info) continue;
        if (info.ctype !== 3)
          bad.push(dir + "/" + which + ".png (" +
            ({0:"greyscale", 2:"RGB", 4:"greyscale+alpha", 6:"RGBA"}[info.ctype] || "type " + info.ctype) + ")");
        else if (info.plte !== 4)
          bad.push(dir + "/" + which + ".png (" + info.plte + "-colour palette)");
        break;
      }
    }
  }
  return bad;
}

// A terse reason for the slot notice; checkMonPics logs the full per-file list
async function picFailReason(repo, entry, back){
  const which = back ? "back" : "front";
  for (const dir of [entry.folder, entry.folder + "_s"]){
    let info = null;
    try { info = pngInfo(await repo.bytes("gfx/pokemon/" + dir + "/" + which + ".png")); }
    catch (e){ continue; }
    // kept to words of five characters or fewer: the player's box is only
    // six tiles wide and one is padding
    if (!info) return "bad png";
    if (info.ctype !== 3) return "not a 4-col png";
    if (info.plte !== 4) return "pal not 4 col";
    return "bad png";
  }
  return "no " + which + " png";
}

async function loadMonPic(repo, entry, back){
  const which = back ? "back" : "front";
  /* Unown keeps no pics in its own folder - they live in unown_a .. unown_z,
     one per letter - so palettes.asm points at gfx/pokemon/unown for the
     palette while the graphics are elsewhere. S is used here because it is
     the form the Ruins of Alph puzzles and the dex sprite default to. */
  const dirs = [entry.folder, entry.folder + "_s"];
  let img = null;
  for (const dir of dirs){
    try { img = await loadImageRGBA(await repo.bytes("gfx/pokemon/" + dir + "/" + which + ".png")); }
    catch (e){ continue; }
    if (img && img.idx && img.pal && img.pal.length === 4) break;
    img = null;
  }
  if (!img) return null;
  const size = img.w / 8;
  const decoded = picPalette(img, img.w, entry.reverse);
  if (!decoded) return null;
  const frame = decoded.idx;
  let pal = decoded.pal;
  /* Most species have no normal.pal: the Makefile generates normal.gbcpal
     from the png, so the png's own palette is the source. The few that ship
     one - Unown, whose folder has no png to derive from - are the exception,
     and theirs wins. Colours 0 and 3 stay pure white and black either way,
     as gbcpal forces them. */
  try {
    const own = parseShinyPal(await repo.text("gfx/pokemon/" + entry.folder + "/normal.pal"));
    if (own) pal = [GBC_WHITE, own[0], own[1], GBC_BLACK];
  } catch (e){}
  let shinyPal = pal.slice();
  try {
    const sh = parseShinyPal(await repo.text(entry.shinyFile));
    if (sh) shinyPal = [GBC_WHITE, sh[0], sh[1], GBC_BLACK];
  } catch (e){}
  return {idx: frame, w: img.w, h: img.w, size, pal, shinyPal, back, entry};
}

/* Build the pic for a slot: its own palette reordered by the current DMG
   palette byte, drawn into the slot's box with the game's padding. Working
   from indices rather than the rendered image means the palette is exact,
   instead of being recovered by ranking colours out of a screenshot. */
function monCanvas(side, byte){
  const pic = monPicStore[side];
  if (!pic) return null;
  const shiny = !!monShiny[side];
  const key = side + ":" + (shiny ? "s" : "n") + ":" + byte;
  if (monPicCanvas.has(key)) return monPicCanvas.get(key);
  const base = picBase(side), px = base * 8;
  const pal = shiny ? pic.shinyPal : pic.pal;
  const map = palMap(byte);
  const c = document.createElement("canvas");
  c.width = px; c.height = px;
  const cx = c.getContext("2d");
  const out = cx.createImageData(px, px);
  const blank = pal[map[0]];
  for (let i = 0; i < px * px; i++){
    out.data[i*4]   = (blank >> 16) & 0xff;
    out.data[i*4+1] = (blank >> 8) & 0xff;
    out.data[i*4+2] = blank & 0xff;
    out.data[i*4+3] = 255;
  }
  // the player's 6x6 box takes a backpic flush; the enemy's 7x7 box pads
  const off = pic.back ? {x: 0, y: 0} : frontPicOffset(pic.size);
  for (let y = 0; y < pic.h; y++){
    const dy = y + off.y;
    if (dy < 0 || dy >= px) continue;
    for (let x = 0; x < pic.w; x++){
      const dx = x + off.x;
      if (dx < 0 || dx >= px) continue;
      const v = pal[map[pic.idx[y * pic.w + x] & 3]];
      const o = (dy * px + dx) * 4;
      out.data[o] = (v >> 16) & 0xff;
      out.data[o+1] = (v >> 8) & 0xff;
      out.data[o+2] = v & 0xff;
      out.data[o+3] = 255;
    }
  }
  cx.putImageData(out, 0, 0);
  monPicCanvas.set(key, c);
  return c;
}

function parsePicSwaps(text){
  const out = {sub: {}, minimize: {}};
  if (!text) return out;
  const lines = text.split("\n").map(l => stripComment(l)[0]);
  const blockOf = (label) => {
    const at = lines.findIndex(l => new RegExp("^" + label + ":").test(l));
    if (at < 0) return [];
    const body = [];
    for (let i = at + 1; i < lines.length; i++){
      if (/^\w+:/.test(lines[i]) && !/^\./.test(lines[i])) break;
      body.push(lines[i]);
    }
    return body;
  };
  // sScratch + (col * base + row) tiles
  const DEST = /sScratch\s*\+\s*\(\s*(\d+)\s*\*\s*(\d+)\s*\+\s*(\d+)\s*\)\s*tiles/;
  const SRC  = /MonsterSpriteGFX\s*\+\s*(\d+)\s*tiles/;

  // RaiseSub: src/dest pairs, the .player label splitting the two sides
  const rs = blockOf("GetSubstitutePic").length
    ? blockOf("GetSubstitutePic") : blockOf("BattleAnimCmd_RaiseSub");
  let side = 0;                                  // before .player: the enemy pic
  let pendingSrc = null;
  for (const l of rs){
    if (/^\.player\b/.test(l.trim())){ side = 1; pendingSrc = null; continue; }
    let m = l.match(SRC);
    if (m){ pendingSrc = +m[1]; continue; }
    m = l.match(DEST);
    if (m && pendingSrc !== null){
      const col = +m[1], base = +m[2], row = +m[3];
      const s = out.sub[side] || (out.sub[side] = {base, cells: []});
      s.base = base;
      s.cells.push({src: pendingSrc, col, row});
      pendingSrc = null;
    }
  }
  // GetMinimizePic: one dest per side, no source index (always the whole tile)
  const mz = blockOf("GetMinimizePic");
  side = 0;
  for (const l of mz){
    if (/^\.player\b/.test(l.trim())){ side = 1; continue; }
    const m = l.match(DEST);
    if (m)
      out.minimize[side] = {base: +m[2], cells: [{src: 0, col: +m[1], row: +m[3]}]};
  }
  return out;
}

function parsePicResize(text){
  const out = {coords: [], squares: [], scripts: {}};
  if (!text) return out;
  const lines = text.split("\n").map(l => stripComment(l)[0]);
  const blockOf = (label) => {
    const at = lines.findIndex(l => new RegExp("^" + label + ":").test(l));
    if (at < 0) return [];
    const body = [];
    for (let i = at + 1; i < lines.length; i++){
      if (/^BattleBGEffect_\w+:/.test(lines[i])) break;
      body.push(lines[i]);
    }
    return body;
  };
  // db values under a local label, stopping at the next label
  const dbUnder = (body, label) => {
    const at = body.findIndex(l => new RegExp("^\\." + label + ":?\\s*$").test(l.trim()));
    if (at < 0) return [];
    const rows = [];
    for (let i = at + 1; i < body.length; i++){
      const s = body[i].trim();
      if (!s) continue;
      if (/^\.\w+:?$/.test(s) || /^MACRO\b|^ENDM\b/.test(s)) break;
      if (!s.startsWith("db ")) break;
      rows.push(splitArgs(s.slice(3)).map(v => num(v)));
    }
    return rows;
  };

  const engine = blockOf("BattleBGEffect_RunPicResizeScript");
  // .Coords: dwcoord x, y
  const cAt = engine.findIndex(l => /^\.Coords:?\s*$/.test(l.trim()));
  if (cAt >= 0)
    for (let i = cAt + 1; i < engine.length; i++){
      const s = engine[i].trim();
      if (!s) continue;
      const m = s.match(/^dwcoord\s+(.*)/);
      if (!m) break;
      const a = splitArgs(m[1]).map(v => num(v));
      out.coords.push({x: a[0], y: a[1]});
    }
  // .BGSquares: bgsquare w, h, .Label  (the macro is defined inline here)
  const sAt = engine.findIndex(l => /^\.BGSquares:?\s*$/.test(l.trim()));
  if (sAt >= 0)
    for (let i = sAt + 1; i < engine.length; i++){
      const s = engine[i].trim();
      const m = s.match(/^bgsquare\s+(.*)/);
      if (!m) continue;
      const a = splitArgs(m[1]);
      const w = num(a[0]), h = num(a[1]), label = a[2].replace(/^\./, "");
      const rows = dbUnder(engine, label);
      let max = 0;
      for (const r of rows) for (const v of r) if (v > max) max = v;
      const base = Math.max(1, Math.round(Math.sqrt(max + 1)));
      out.squares.push({w, h, label, tiles: rows, base});
    }

  for (const name of ["EnterMon", "ReturnMon"]){
    const body = blockOf("BattleBGEffect_" + name);
    const script = {};
    for (const [key, label] of [[0, "EnemyData"], [1, "PlayerData"]]){
      const flat = [].concat(...dbUnder(body, label));
      const steps = [];
      for (let i = 0; i < flat.length; ){
        const v = flat[i];
        if (v === -1) break;                       // end of script
        steps.push({op: v, tile: flat[i+1], coord: flat[i+2]});
        i += 3;
      }
      script[key] = steps;
    }
    out.scripts[name] = script;
  }
  return out;
}

function parseBGPalLists(text){
  const out = {};
  const lines = (text || "").split("\n");
  let cur = null;
  for (let i = 0; i < lines.length; i++){
    const m = lines[i].match(/^BattleBGEffect_(\w+):/);
    if (m){ cur = m[1]; continue; }
    if (cur === "FadeMonsToBlackRepeating" &&
        /^\.(CGB_DMGEnemyData|DMG_PlayerData):?$/.test(lines[i].trim())){
      const key = /Enemy/.test(lines[i]) ? "FadeMonsToBlackEnemy"
                                         : "FadeMonsToBlackPlayer";
      const rows = [];
      for (let j = i + 1; j < lines.length; j++){
        const d = stripComment(lines[j])[0].trim();
        if (!d.startsWith("db ")) break;
        const vals = splitArgs(d.slice(3)).map(v => num(v) & 0xff);
        if (vals.length === 2) rows.push(vals);
      }
      if (rows.length === 4) out[key] = rows;
      continue;
    }
    if (cur && /^\.Pals:?$/.test(lines[i].trim())){
      for (let j = i + 1; j < i + 4 && j < lines.length; j++){
        const d = stripComment(lines[j])[0].trim();
        if (!d.startsWith("db ")) continue;
        out[cur] = splitArgs(d.slice(3)).map(v => {
          const n = num(v) & 0xff;
          return n === 0xff ? -1 : (n === 0xfe ? -2 : n);
        });
        break;
      }
    }
  }
  return out;
}

function parseWaterTuning(text){
  const out = {growth: 1, phaseStep: 4, limit: 0x20};
  if (!text) return out;
  const lines = text.split("\n").map(l => stripComment(l)[0].trim());
  const at = lines.findIndex(l => /^BattleBGEffect_Water:/.test(l));
  if (at < 0) return out;
  let growth = 0, sawLimit = false;
  for (let i = at + 1; i < lines.length && i < at + 60; i++){
    const s = lines[i];
    if (/^BattleBGEffect_/.test(s)) break;
    let m;
    if (!sawLimit && (m = s.match(/^add \$?([0-9a-f]+)$/i)) && out.phaseStepSeen === undefined){
      out.phaseStep = num("$" + m[1]);
      out.phaseStepSeen = true;
      continue;
    }
    if ((m = s.match(/^cp \$?([0-9a-f]+)$/i))){ out.limit = num("$" + m[1]); sawLimit = true; continue; }
    if (sawLimit && /^inc \[hl\]$/.test(s)){ growth++; continue; }
    if (sawLimit && /DeformWater/.test(s)) break;
  }
  if (growth) out.growth = growth;
  delete out.phaseStepSeen;
  return out;
}

function parseBGEffectTable(text){
  const out = [];
  const lines = text.split("\n");
  let i = lines.findIndex(l => /^BattleBGEffects:/.test(l.trim()));
  if (i < 0) return out;
  for (let j = i + 1; j < lines.length; j++){
    const s = stripComment(lines[j])[0].trim();
    if (!s || /^table_width/.test(s)) continue;
    const m = s.match(/^dw\s+([A-Za-z_]\w*)/);
    if (m){ out.push(m[1].replace(/^BattleBGEffect_/, "")); continue; }
    if (out.length) break;
  }
  return out;
}

/* dc a,b,c,d packs four 2-bit shades; shade for colour i is bits (2i..2i+1) */
const dc = (a, bb, c, d) => ((a << 6) | (bb << 4) | (c << 2) | d) & 0xff;
const palMap = byte => [0, 1, 2, 3].map(i => (byte >> (2 * i)) & 3);
const DMG_IDENTITY = 0xe4;
const TEXTBOX_Y = 12 * 8;                  // the message box starts at tile row 12
// vBGMap is 32x32 tiles, so the background repeats every 256px in both axes.
// Only the top-left 160x144 of it is ever written; the rest is blank tiles.
const BG_MAP_SIZE = 32 * 8;
const BG_WRAPS = [-BG_MAP_SIZE, 0, BG_MAP_SIZE];

const BGP_LISTS = {
  inverted:  [dc(3,2,1,0), dc(0,1,2,3)],
  white:     [dc(3,2,1,0), dc(0,0,0,0)],
  whiteHues: [dc(3,2,1,0), dc(3,2,0,0), dc(3,1,0,0), -1],
  blackHues: [dc(3,2,1,0), dc(3,3,1,0), dc(3,3,2,0), -1],
  alternate: [dc(3,2,1,0), dc(3,3,2,0), dc(3,3,3,0), dc(3,3,2,0),
              dc(3,2,1,0), dc(2,1,0,0), dc(1,0,0,0), dc(2,1,0,0), -2],
  obGrayYellow:      [dc(3,2,1,0), dc(2,1,0,0), -2],
  obGrayYellowFull:  [dc(3,2,1,0), dc(2,1,0,3), dc(1,0,3,2), dc(0,3,2,1), -2],
  obMidGrayYellow:   [dc(3,2,1,0), dc(3,1,2,0), -2],
  bgInverted:        [dc(0,1,2,3), dc(1,2,0,3), dc(2,0,1,3), -2],
};

/* BattleBGEffect_GetFirstDMGPal / GetNextDMGPal: walk a list, -1 ends the
   effect, -2 restarts it. Returns null when the effect should end. */
function nextDMGPal(e, list){
  let a = e.param;
  e.param = b(e.param + 1);
  let v = list[a];
  if (v === undefined || v === -1) return null;
  if (v === -2){ v = list[0]; e.param = 0; }
  return v;
}
// BattleBGEffect_GetNthDMGPal: turn doubles as the frame delay between steps
function nthDMGPal(e, list){
  if (e.jti !== 0){
    e.jti = b(e.jti - 1);
    const a = e.param;
    let v = list[a];
    if (v === undefined || v === -1) return null;
    if (v === -2){ v = list[0]; e.param = 0; }
    return v;
  }
  e.jti = e.turn;
  return nextDMGPal(e, list);
}

/* ------------------------------------------------------------------------
   Engine timing.

   One iteration of RunBattleAnimScript ends in BattleAnimDelayFrame, so it
   nominally takes one vblank - but only if its work fits in a frame. When an
   LY override is armed, LCDGeneric runs on every scanline: push af / ldh /
   and / jr / push bc / ldh rLY / cp / jr / ld c / ld b / ld a,[bc] / ld b,a /
   ldh / ld c,a / ld a,b / ldh [c],a / pop bc / pop af / reti, plus interrupt
   dispatch - about 204 t-states, 154 times a frame. That is ~45% of the
   70224 t-states in a frame, on top of the vblank handler (sound engine, map
   and OAM copies) and the script and object work. The overrun makes the loop
   miss a vblank now and then, which is why the sine-wave effects run slower
   than the ones without them.

   Costs are accumulated per iteration and a frame is dropped whenever the
   spill passes a frame's worth. ENGINE_BASE covers the vblank handler and the
   loop body; it is calibrated so that LY-heavy animations come out ~20%
   slower than plain ones, matching the hardware.
   ------------------------------------------------------------------------ */
const FRAME_TSTATES = 70224;
const LCD_STAT_TSTATES = 204 * 154;        // the per-scanline handler
const ENGINE_BASE = 34000;                 // vblank handler + loop body
const OBJECT_TSTATES = 1300;               // DoBattleAnimFrame + OAM write

const BGF = {};                            // name -> function(e, S)
const bgEnd = e => { e.dead = true; };

/* LY overrides: the LCD STAT handler rewrites rSCX (or rSCY) on each
   scanline from wLYOverrides, which is how the ripple effects work - the
   background is displaced by a different amount on every line. The buffer,
   its line range and which register it feeds all live in the screen state,
   and the renderer blits the background row by row through it. */
/* BattleBGEffects_ClearLYOverrides only zeroes the buffers - the register the
   override feeds and its line range stay armed, so other effects sharing it
   keep working. BattleAnim_ResetLCDStatCustom is the one that tears the whole
   thing down. */
function lyZero(S){
  if (S.ly) S.ly.fill(0);
}
function lyClear(S){
  S.ly = null; S.lyStart = 0; S.lyEnd = 0; S.lyAxis = "x";
}
function lyBuf(S){
  if (!S.ly) S.ly = new Int8Array(160);
  return S.ly;
}
// t-states of work an effect did this frame, for the timing model below
const charge = (S, t) => { S.work = (S.work || 0) + t; };
// BattleBGEffect_SetLCDStatCustoms1 / 2: the line range covers one mon's rows
function setLCDStat(S, axis, e, variant){
  S.lyAxis = axis;
  if (e.targetSide){ S.lyStart = 0x00; S.lyEnd = 0x36; }
  else { S.lyStart = variant === 2 ? 0x2d : 0x2f; S.lyEnd = 0x5e; }
  lyBuf(S);
}
// DeformScreen: walk 128 lines, writing sin(progress) where progress advances
// by `off` per line - a standing wave down the screen
function deformScreen(S, amp, off){
  const buf = lyBuf(S);
